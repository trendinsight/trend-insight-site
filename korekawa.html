<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c111c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>고레가와 · 수면 아래 우량주 판정</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c111c; --panel:#141c2b; --panel2:#1a2336; --line:#26314a;
  --ink:#e9eef7; --muted:#8896ae; --faint:#5d6b85;
  --kame:#12b886; --warn:#f5a524; --bad:#e5484d; --accent:#E8621B; --blue:#3b82f6;
  --up:#f0454e; --down:#3b82f6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Pretendard',sans-serif;
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;flex-wrap:wrap;
  background:linear-gradient(180deg,#101827,#0c111c);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:baseline;gap:9px;white-space:nowrap}
.brand .ti{font-family:'JetBrains Mono';font-weight:700;font-size:20px;color:var(--accent);
  letter-spacing:1px;border:1.5px solid var(--accent);border-radius:6px;padding:1px 8px}
.brand h1{font-size:15px;font-weight:700}
.brand small{color:var(--faint);font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
.searchwrap{position:relative;flex:1;min-width:220px;max-width:420px}
#q{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  color:var(--ink);padding:10px 14px;font-size:14px;font-family:inherit;outline:none}
#q:focus{border-color:var(--kame)} #q::placeholder{color:var(--faint)}
#qresults{position:absolute;top:calc(100% + 5px);left:0;right:0;background:var(--panel2);
  border:1px solid var(--line);border-radius:9px;overflow:hidden;display:none;z-index:50;
  box-shadow:0 10px 30px rgba(0,0,0,.5)}
#qresults .qi{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer}
#qresults .qi:hover,#qresults .qi.hl{background:#232d44}
#qresults .qi .nm{font-weight:600;font-size:13.5px}
#qresults .qi .cd{font-family:'JetBrains Mono';font-size:11px;color:var(--faint);margin-left:auto}
#qresults .qmsg{cursor:default;display:block;padding:11px 14px;line-height:1.6}
#qresults .qmsg .cd{display:block;margin:3px 0 0;font-size:11px}
#qresults .qi .mk{font-size:10px;color:var(--kame);border:1px solid rgba(18,184,134,.4);
  border-radius:4px;padding:1px 5px}
main{max-width:1100px;margin:0 auto;padding:18px 20px 48px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:52vh;
  color:var(--faint);text-align:center;gap:10px;padding:20px}
.empty .big{font-size:44px;opacity:.35}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--kame);
  border-radius:50%;animation:sp .8s linear infinite;margin:70px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.dhead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.dhead .nm{font-size:22px;font-weight:800}
.dhead .cd{color:var(--faint);font-size:12px;font-family:'JetBrains Mono'}
.dhead .px{margin-left:auto;text-align:right}
.dhead .px b{font-size:22px;font-family:'JetBrains Mono'}
.dhead .px span{font-size:12.5px;font-family:'JetBrains Mono'}
.verdict{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
  border-left-width:4px;border-radius:12px;padding:14px 16px;margin-bottom:16px;flex-wrap:wrap}
.verdict .tag{font-size:16px;font-weight:800;letter-spacing:-.2px}
.verdict .msg{color:var(--muted);font-size:13px;flex:1;min-width:220px}
.v-kame{border-left-color:var(--kame)} .v-kame .tag{color:var(--kame)}
.v-watch{border-left-color:var(--warn)} .v-watch .tag{color:var(--warn)}
.v-avoid{border-left-color:var(--bad)} .v-avoid .tag{color:var(--bad)}
.cols{display:grid;grid-template-columns:1.15fr 1fr;gap:16px}
@media(max-width:840px){.cols{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h3{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.3px;margin-bottom:12px;
  text-transform:uppercase;font-family:'JetBrains Mono'}
.fuji{width:100%;height:auto;display:block}
.ridgeinfo{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.ridgeinfo b{font-size:19px;color:var(--kame);font-family:'JetBrains Mono'}
.ridgeinfo span{color:var(--faint);font-size:11.5px}
.gate{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.gate:last-child{border-bottom:0;padding-bottom:0}
.pill{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap;
  font-family:'JetBrains Mono';margin-top:1px}
.p-pass{background:rgba(18,184,134,.16);color:var(--kame)}
.p-cond{background:rgba(245,165,36,.16);color:var(--warn)}
.p-fail{background:rgba(229,72,77,.16);color:var(--bad)}
.gate .body .t{font-weight:700;font-size:13.5px}
.gate .body .d{color:var(--muted);font-size:12.5px;line-height:1.55;margin-top:2px}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 14px;margin-top:4px}
.metric{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px dashed var(--line);padding-bottom:6px}
.metric .k{color:var(--faint);font-size:12px}
.metric .v{font-family:'JetBrains Mono';font-size:13px;font-weight:600}
.bar{height:7px;background:#0c111c;border-radius:5px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:5px;background:var(--kame)}
.scorerow{display:flex;justify-content:space-between;align-items:center;margin-top:12px;
  font-size:12.5px;color:var(--muted)}
.scorerow b{font-family:'JetBrains Mono';font-size:17px;color:var(--ink)}
.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:4px}
.inputs label{display:block;color:var(--faint);font-size:11px;margin-bottom:4px}
.inputs input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  color:var(--ink);padding:8px 10px;font-family:'JetBrains Mono';font-size:13px;outline:none}
.inputs input:focus{border-color:var(--kame)}
.plan{margin-top:2px}
.plan .step{display:flex;justify-content:space-between;align-items:center;padding:9px 0;
  border-bottom:1px solid var(--line);font-size:13px}
.plan .step:last-child{border-bottom:0}
.plan .step .l{color:var(--muted)} .plan .step .r{font-family:'JetBrains Mono';font-weight:600}
.hint{color:var(--faint);font-size:11.5px;line-height:1.6;margin-top:10px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 17px;
  margin-top:16px;color:var(--muted);font-size:12.5px;line-height:1.85}
.note b{color:var(--ink)}
.note .say{color:var(--kame);font-style:italic}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="ti">Ti</span><h1>고레가와</h1><small>Korekawa Method</small></div>
  <div class="searchwrap">
    <input id="q" placeholder="종목명 검색, 또는 6자리 코드 입력 후 Enter" autocomplete="off">
    <div id="qresults"></div>
  </div>
</header>
<main>
  <div id="detail">
    <div class="empty"><div class="big">🐢</div>
      <div>종목을 검색하면 <b>후지산 능선(52주 밴드 위치)</b>과<br>
      수면 아래 여부·완력시세 배제를 판정합니다</div></div>
  </div>
</main>
<script>
const $=s=>document.querySelector(s);
const API='/api/cockpit';
const fmt=(n,d)=>n==null||isNaN(n)?'—':Number(n).toLocaleString('ko-KR',{minimumFractionDigits:d??0,maximumFractionDigits:d??2});
const cls=v=>v>0?'up':(v<0?'down':'');
const sign=v=>v>0?'▲':(v<0?'▼':'');
let CUR=null;   // 현재 분석 결과 보관 (입력값 변경 시 재렌더용)

/* ── 검색 (일목·시그널 앱과 동일) ── */
let qTimer=null,qItems=[],qHl=-1;
const qBox=$('#qresults'),qIn=$('#q');
function hideQ(){qBox.style.display='none';qHl=-1;}
function showMsg(html){qBox.innerHTML=`<div class="qi qmsg">${html}</div>`;qBox.style.display='block';}
function renderQ(){
  if(!qItems.length){showMsg('<span class="nm" style="color:var(--faint)">검색 결과 없음</span>');return;}
  qBox.innerHTML=qItems.map((x,i)=>`<div class="qi ${i===qHl?'hl':''}" data-i="${i}">
    <span class="nm">${x.name}</span><span class="mk">${x.market||''}</span><span class="cd">${x.code}</span></div>`).join('');
  qBox.style.display='block';
  qBox.querySelectorAll('.qi').forEach(el=>el.onclick=()=>pickQ(+el.dataset.i));
}
function pickQ(i){const x=qItems[i];if(!x)return;hideQ();qIn.value=x.name;qIn.blur();analyze(x.code,x.name);}
qIn.addEventListener('input',()=>{
  clearTimeout(qTimer);const q=qIn.value.trim();
  if(q.length<1){hideQ();return;}
  qTimer=setTimeout(async()=>{
    try{
      const res=await fetch(`${API}/search?q=${encodeURIComponent(q)}`);
      if(!res.ok){showMsg(`<span class="nm" style="color:var(--warn)">검색 API 응답 오류 (${res.status})</span>`);return;}
      const r=await res.json();
      qItems=r.data||[];qHl=qItems.length?0:-1;renderQ();
    }catch(e){
      showMsg(`<span class="nm" style="color:var(--bad)">검색 서버에 연결하지 못했습니다</span>
        <span class="cd">${location.protocol==='file:'?'로컬 파일로 열면 안 됩니다 — 사이트 주소로 접속하세요':'/api/cockpit 확인 필요'}</span>`);
    }
  },250);
});
qIn.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&/^\d{6}$/.test(qIn.value.trim())){
    e.preventDefault();hideQ();qIn.blur();analyze(qIn.value.trim(),qIn.value.trim());return;}
  if(qBox.style.display!=='block')return;
  if(e.key==='ArrowDown'){e.preventDefault();qHl=Math.min(qHl+1,qItems.length-1);renderQ();}
  else if(e.key==='ArrowUp'){e.preventDefault();qHl=Math.max(qHl-1,0);renderQ();}
  else if(e.key==='Enter'){e.preventDefault();
    const raw=qIn.value.trim();
    if(/^\d{6}$/.test(raw)){hideQ();qIn.blur();analyze(raw,raw);return;}
    pickQ(qHl>=0?qHl:0);}
  else if(e.key==='Escape'){hideQ();}
});
document.addEventListener('click',e=>{if(!e.target.closest('.searchwrap'))hideQ();});

/* ── 고레가와 계산 (korekawa_judge.py / korekawa_screen.py와 같은 규칙) ── */
function sma(a,n,i){let t=0;for(let j=i-n+1;j<=i;j++)t+=a[j];return t/n;}
function compute(c){
  const close=c.close, vol=c.volume, i=close.length-1, cur=close[i], N=close.length;
  const hi=Math.max(...close), lo=Math.min(...close);      // API가 주는 전 구간(약 120거래일)
  const pos=hi>lo?(cur-lo)/(hi-lo):0.5;
  const ma=n=>N>=n?sma(close,n,i):null;
  const val=close.map((p,k)=>p*vol[k]);                    // 거래대금
  const roll=[];                                           // 20일 평균 거래대금 시계열
  for(let k=19;k<val.length;k++)roll.push(sma(val,20,k));
  const v20=roll[roll.length-1];
  const pct=Math.round(roll.filter(x=>x<=v20).length/roll.length*100);   // 낮을수록 한산
  const vq20=sma(vol,20,i), vq60=N>=60?sma(vol,60,i):vq20;
  const ret=d=>N>d?(cur/close[N-1-d]-1)*100:null;
  const maLong=ma(120)??ma(60), longN=ma(120)!=null?120:60;
  return {i,cur,hi,lo,pos,N,winMonths:(N/21).toFixed(0),
    ma20:ma(20),ma60:ma(60),maLong,longN,
    aboveLong:maLong==null?null:cur>maLong,
    volRatio:vq60?vq20/vq60:null, val20:v20, valPct:pct,
    r1:ret(21), r3:ret(63), rAll:ret(N-1), date:c.date[i]};
}
function ridgeLabel(pos){return (pos*10).toFixed(1)+'부 능선';}
function scoreRidge(p){return p>=0.10&&p<=0.40?10:p<=0.55?6:p<=0.70?3:p<=0.85?1:0;}
function scoreNeglect(m){
  let s=0;
  s+= m.valPct<=20?10 : m.valPct<=40?7 : m.valPct<=60?4 : 0;
  s+= m.rAll==null?0 : m.rAll<=-20?8 : m.rAll<=0?5 : m.rAll<=10?2 : 0;
  s+= m.aboveLong===false?7:0;
  return s;
}
function scoreValue(pbr,per,div){
  let s=0;
  if(pbr>0) s+= pbr<=0.5?10 : pbr<=0.8?7 : pbr<=1.0?4 : 0;
  if(per>0) s+= per<=7?10 : per<=10?7 : per<=12?4 : 0;
  if(div>0) s+= div>=4?5 : div>=2.5?3 : 0;
  return s;
}
function gates(m){
  const g3 = m.pos>=0.85 ? ['FAIL','p-fail',`밴드 ${(m.pos*100).toFixed(0)}% — 8부 능선 위입니다. 고레가와는 오른 주식을 깊이 쫓지 않았습니다.`]
           : m.pos<=0.40 ? ['PASS','p-pass',`밴드 ${(m.pos*100).toFixed(0)}% — 2·3부 능선권. 사 모으고 기다릴 자리입니다.`]
           : ['조건부','p-cond',`밴드 ${(m.pos*100).toFixed(0)}% — 중턱입니다. 사려면 분할 비중을 줄이십시오.`];
  const hits=[];
  if(m.volRatio&&m.volRatio>=3) hits.push(`거래량이 60일 평균의 ${m.volRatio.toFixed(1)}배`);
  if(m.r1!=null&&m.r1>=30) hits.push(`1개월 +${m.r1.toFixed(0)}% 급등`);
  const g4 = hits.length>=2 ? ['FAIL','p-fail','완력시세 신호 2개 — 실적이 아니라 수급으로 밀어올린 시세입니다. '+hits.join(', ')]
           : hits.length===1 ? ['조건부','p-cond','완력시세 신호 1개 — '+hits[0]+'. 실적 근거를 먼저 확인하십시오.']
           : ['PASS','p-pass','급등·거래량 폭증 신호 없음. 실적 추세는 DART로 따로 확인하십시오.'];
  // 떨어지는 칼 가드 — 52주 신저가권에서 아직 하락 정렬이 살아 있으면 매집 자리가 아니다
  const falling = m.pos<=0.08 && m.ma20!=null && m.ma60!=null && m.cur<m.ma20 && m.ma20<m.ma60;
  const quiet = m.valPct<=40 && (m.aboveLong===false || (m.rAll!=null&&m.rAll<=0));
  const g1 = quiet ? ['PASS','p-pass',`거래대금이 최근 ${m.winMonths}개월 중 하위 ${m.valPct}% 수준이고 주가도 소외돼 있습니다. 수면 아래입니다.`]
           : m.valPct<=60 ? ['조건부','p-cond',`거래대금 백분위 ${m.valPct}%(최근 ${m.winMonths}개월) — 아직 완전히 한산하진 않습니다.`]
           : ['FAIL','p-fail',`거래대금 백분위 ${m.valPct}%(최근 ${m.winMonths}개월) — 이미 사람이 몰린 종목입니다. 수면 위입니다.`];
  return {g1,g3,g4,falling};
}
function verdict(g,priceScore){
  const anyFail=[g.g1,g.g3,g.g4].some(x=>x[0]==='FAIL');
  if(g.g3[0]==='FAIL') return ['추격 금지','v-avoid','8부 능선 위입니다. 2·3부 능선까지 내려오면 그때 보십시오.'];
  if(g.g4[0]==='FAIL') return ['완력시세 — 회피','v-avoid','실적이 아니라 힘으로 만든 시세는 경원합니다.'];
  if(anyFail) return ['수면 위 — 대상 아님','v-avoid','이미 사람이 몰렸습니다. 이 방법론의 사냥터가 아닙니다.'];
  if(g.falling) return ['낙하 중 — 대기','v-watch','52주 신저가권인데 아직 하락 정렬(주가&lt;20일선&lt;60일선)이 살아 있습니다. 싸다는 이유만으로 사면 떨어지는 칼입니다. 하락 사유가 실적 훼손인지 먼저 확인하고, 20일선 회복이나 바닥 다지기를 기다리십시오.'];
  if(priceScore>=26) return ['카메 후보','v-kame','가격·거래 축은 통과했습니다. 우량성(DART)과 2년 후 대국관을 확인하면 매집 판정으로 넘어갑니다.'];
  return ['관찰','v-watch','조건이 아직 무릅니다. 더 소외되거나 더 내려오기를 기다리십시오.'];
}

/* ── 후지산 능선 SVG ── */
function fuji(pos){
  const P=t=>[26+150*t, 148-112*t];                 // 왼쪽 능선 좌표
  const zA=P(0.10), zB=P(0.40), m=P(Math.max(0,Math.min(1,pos)));
  return `<svg class="fuji" viewBox="0 0 340 170">
    <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16203a"/><stop offset="100%" stop-color="#0c111c"/></linearGradient></defs>
    <rect x="0" y="0" width="340" height="170" fill="url(#sky)" rx="10"/>
    <polygon points="26,148 176,36 326,148" fill="#1c2740" stroke="#2b3860" stroke-width="1.5"/>
    <polygon points="150,60 176,36 202,60 190,64 176,56 162,64" fill="#e9eef7" opacity=".85"/>
    <line x1="${zA[0]}" y1="${zA[1]}" x2="${zB[0]}" y2="${zB[1]}" stroke="#12b886" stroke-width="6" stroke-linecap="round" opacity=".55"/>
    <text x="${zA[0]-4}" y="${zA[1]+16}" fill="#12b886" font-size="10" font-family="JetBrains Mono">2·3부 능선</text>
    <circle cx="${m[0]}" cy="${m[1]}" r="6.5" fill="#E8621B" stroke="#0c111c" stroke-width="2"/>
    <text x="${Math.min(m[0]+11,250)}" y="${m[1]-8}" fill="#e9eef7" font-size="11.5" font-weight="700" font-family="JetBrains Mono">현재</text>
    <line x1="26" y1="152" x2="326" y2="152" stroke="#26314a" stroke-width="1"/>
    <text x="26" y="165" fill="#5d6b85" font-size="9.5" font-family="JetBrains Mono">구간 저점</text>
    <text x="286" y="165" fill="#5d6b85" font-size="9.5" font-family="JetBrains Mono">구간 고점</text>
  </svg>`;
}

/* ── 렌더 ── */
function render(){
  const {m,g,name,code,quote}=CUR;
  const pbr=parseFloat($('#i-pbr')?.value)||CUR.pbr||0;
  const per=parseFloat($('#i-per')?.value)||CUR.per||0;
  const div=parseFloat($('#i-div')?.value)||CUR.div||0;
  const tgt=parseFloat($('#i-tgt')?.value)||CUR.tgt||0;
  CUR.pbr=pbr;CUR.per=per;CUR.div=div;CUR.tgt=tgt;
  const sP=scoreRidge(m.pos), sS=scoreNeglect(m), sV=scoreValue(pbr,per,div);
  const price=sP+sS, total=price+sV;
  const v=verdict(g,price);
  const px=quote.price??m.cur, rate=quote.change_rate||0, chg=quote.change||0;

  $('#detail').innerHTML=`
  <div class="dhead">
    <div><div class="nm">${name}</div><div class="cd">${code} · ${m.date}</div></div>
    <div class="px"><b class="${cls(rate)}">${fmt(px)}</b>
      <span class="${cls(rate)}">${sign(rate)} ${fmt(Math.abs(chg))} (${fmt(rate,2)}%)</span></div>
  </div>

  <div class="verdict ${v[1]}">
    <span class="tag">${v[0]}</span>
    <span class="msg">${v[2]}</span>
    <span class="mono" style="font-size:13px;color:var(--faint)">가격·거래축 ${price}/35${sV?` · 저평가 ${sV}/25 · 합계 ${total}/60`:''}</span>
  </div>

  <div class="cols">
    <div class="panel">
      <h3>후지산 능선 — 최근 ${m.winMonths}개월 밴드 기준</h3>
      ${fuji(m.pos)}
      <div class="ridgeinfo"><b>${ridgeLabel(m.pos)}</b>
        <span>${m.N}거래일 저점 ${fmt(m.lo)} ~ 고점 ${fmt(m.hi)} 중 ${(m.pos*100).toFixed(0)}%</span></div>
      <div class="metrics" style="margin-top:14px">
        <div class="metric"><span class="k">1개월</span><span class="v ${cls(m.r1)}">${fmt(m.r1,1)}%</span></div>
        <div class="metric"><span class="k">3개월</span><span class="v ${cls(m.r3)}">${fmt(m.r3,1)}%</span></div>
        <div class="metric"><span class="k">${m.winMonths}개월(전 구간)</span><span class="v ${cls(m.rAll)}">${fmt(m.rAll,1)}%</span></div>
        <div class="metric"><span class="k">${m.longN}일선</span><span class="v">${m.aboveLong==null?'—':(m.aboveLong?'위':'아래')}</span></div>
        <div class="metric"><span class="k">거래량 20/60일</span><span class="v">${fmt(m.volRatio,2)}배</span></div>
        <div class="metric"><span class="k">거래대금 백분위</span><span class="v">하위 ${m.valPct}%</span></div>
        <div class="metric" style="grid-column:1/-1;border-bottom:0"><span class="k" style="font-size:11px">
          시세 API가 일봉 ${m.N}개만 제공 — 1년(250일) 창 판정은 채팅 스킬에서</span><span class="v"></span></div>
      </div>
      <div class="scorerow"><span>능선 ${sP}/10 · 소외도 ${sS}/25</span><b>${price}/35</b></div>
      <div class="bar"><i style="width:${price/35*100}%"></i></div>
    </div>

    <div class="panel">
      <h3>게이트 — 카메 1칙 · 5개조 ③④</h3>
      <div class="gate"><span class="pill ${g.g1[1]}">${g.g1[0]}</span>
        <div class="body"><div class="t">수면 아래인가 (카메 1칙)</div><div class="d">${g.g1[2]}</div></div></div>
      <div class="gate"><span class="pill ${g.g3[1]}">${g.g3[0]}</span>
        <div class="body"><div class="t">타당한 수준인가 (5개조 ③)</div><div class="d">${g.g3[2]}</div></div></div>
      <div class="gate"><span class="pill ${g.g4[1]}">${g.g4[0]}</span>
        <div class="body"><div class="t">완력시세가 아닌가 (5개조 ④)</div><div class="d">${g.g4[2]}</div></div></div>
      ${g.falling?`<div class="gate"><span class="pill p-cond">경고</span>
        <div class="body"><div class="t">떨어지는 칼</div><div class="d">52주 신저가권 + 하락 정렬 지속.
        고레가와도 "안이한 역행"은 피하라고 했습니다 — 바닥 다지기를 확인한 뒤 나누어 사십시오.</div></div></div>`:''}
      <div class="hint">나머지 게이트 — ①스스로 공부했는가 ②2년 후 대국관이 있는가 ⑤불측의 사태에 대비했는가 —
        는 사람이 답할 몫입니다. 우량성(3년 흑자·부채비율·영업현금흐름)은 DART 확인이 필요해
        채팅의 <b>고레가와 스킬</b>에서 판정합니다.</div>
    </div>
  </div>

  <div class="cols" style="margin-top:16px">
    <div class="panel">
      <h3>저평가 입력 (선택)</h3>
      <div class="inputs">
        <div><label>PBR</label><input id="i-pbr" class="mono" inputmode="decimal" value="${pbr||''}" placeholder="0.62"></div>
        <div><label>PER</label><input id="i-per" class="mono" inputmode="decimal" value="${per||''}" placeholder="7.4"></div>
        <div><label>배당수익률 %</label><input id="i-div" class="mono" inputmode="decimal" value="${div||''}" placeholder="4.1"></div>
      </div>
      <div class="scorerow"><span>PBR ≤0.5:10 / ≤0.8:7 · PER ≤7:10 / ≤10:7 · 배당 ≥4%:5</span><b>${sV}/25</b></div>
      <div class="bar"><i style="width:${sV/25*100}%"></i></div>
      <div class="hint">시세 API가 재무 지표를 주지 않아 직접 넣습니다. 네이버 금융 종목 화면의 값을 그대로 쓰면 됩니다.
        경기순환주(조선·화학·철강·반도체)는 <b>PER이 가장 낮을 때가 고점</b>이니 PER 점수를 믿지 마십시오.</div>
    </div>

    <div class="panel">
      <h3>3분할 매집 · 복팔분 매도</h3>
      <div class="plan">
        <div class="step"><span class="l">1차 — 현재가</span><span class="r mono">${fmt(m.cur)}</span></div>
        <div class="step"><span class="l">2차 — -8%</span><span class="r mono">${fmt(Math.round(m.cur*0.92))}</span></div>
        <div class="step"><span class="l">3차 — -15%</span><span class="r mono">${fmt(Math.round(m.cur*0.85))}</span></div>
      </div>
      <div class="inputs" style="grid-template-columns:1fr 1fr;margin-top:12px">
        <div><label>목표가</label><input id="i-tgt" class="mono" inputmode="numeric" value="${tgt||''}" placeholder="20000"></div>
        <div><label>복팔분 — 분할매도 개시</label>
          <input class="mono" value="${tgt?fmt(Math.round(tgt*0.8)):'—'}" readonly style="color:var(--kame)"></div>
      </div>
      <div class="hint">목표가의 <b>8할</b>에서 팔기 시작합니다. 시세가 뜨거워졌다고 목표가를 올리지 마십시오 —
        고레가와가 도와광업에서 이익을 토해낸 것이 바로 그 욕심이었습니다.
        분할 금액과 편입 상한은 <b>수중 자금 범위</b>에서 정하고 신용·미수는 쓰지 않습니다(카메 3칙 ③).</div>
    </div>
  </div>

  <div class="note">
    <b>이 앱이 판정하는 것</b> — 지금 이 종목이 <b>수면 아래에 있는지</b>, <b>능선 어디에 서 있는지</b>,
    <b>완력시세인지</b>. 즉 고레가와가 "사지 않을 이유"로 삼았던 것들을 먼저 거릅니다.<br>
    <b>창(window) 주의</b> — 시세 API가 일봉 약 120개만 주므로 이 화면의 능선·소외도는 <b>최근 6개월 밴드</b> 기준입니다.
    고레가와 스킬의 스크리너·판정 스크립트는 <b>1년(250일) 창</b>과 200일선을 쓰므로 점수가 다를 수 있고,
    최종 판정은 스크립트 값을 따릅니다.<br>
    <b>이 앱이 판정하지 못하는 것</b> — 우량성(3년 흑자·부채비율·영업현금흐름)과 2년 후 대국관.
    이 둘이 없으면 싼 주식은 그냥 싼 채로 있습니다. 한국의 만성 저PBR은 지배구조 디스카운트가 원인인 경우가 많아,
    <b>소외의 이유가 해소될 수 있는지</b>에 한 문장으로 답하지 못하면 사지 않는 편이 낫습니다.<br>
    <span class="say">"이건 아직 8부 능선이오. 2부 능선까지 내려오면 그때 부르시오."</span> —
    어조는 저작·어록에 기반한 재구성이며 실제 발언이 아닙니다. 이 화면은 참고 자료이지 매수 지시가 아닙니다.
  </div>`;

  ['i-pbr','i-per','i-div','i-tgt'].forEach(id=>{
    const el=document.getElementById(id); if(!el)return;
    el.addEventListener('change',()=>render());
    el.addEventListener('keydown',e=>{if(e.key==='Enter')render();});
  });
}

async function analyze(code,name){
  $('#detail').innerHTML='<div class="spin"></div>';
  try{
    const r=await(await fetch(`${API}/analyze/${code}`)).json();
    if(!r.ok){$('#detail').innerHTML=`<div class="empty"><div class="big">⚠</div><div>${r.error||'분석 불가'}</div></div>`;return;}
    const d=r.data, c=d.chart;
    if(!c||!c.close||c.close.length<60){
      $('#detail').innerHTML='<div class="empty"><div class="big">⚠</div><div>일봉 60개 미만 — 판정할 수 없습니다</div></div>';return;}
    const m=compute(c);
    CUR={m,g:gates(m),name:d.name||name||d.code,code:d.code||code,quote:d.quote||{},pbr:0,per:0,div:0,tgt:0};
    render();
  }catch(e){
    $('#detail').innerHTML='<div class="empty"><div class="big">⚠</div><div>연결 실패 · 잠시 후 다시 시도하세요</div></div>';
  }
}
</script>
</body>
</html>
