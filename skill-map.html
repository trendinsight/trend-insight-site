const $=s=>document.querySelector(s);
let tagFilter=null;
function render(){
 const gs=$("#groups");gs.innerHTML="";
 const toc=$("#toc");toc.innerHTML="";
 GROUPS.forEach(g=>{
  const items=S.filter(s=>s.g===g.id);
  const sec=document.createElement("section");
  sec.className="group";sec.id=g.id;
  sec.innerHTML=`<div class="ghead" style="border-color:${g.c}"><h2>${g.n}</h2><span class="gq">${g.q}</span><span class="cnt">${items.length}</span></div><div class="grid"></div>`;
  const grid=sec.querySelector(".grid");
  items.forEach(s=>{
   const c=document.createElement("div");c.className="card"+(s.p?" linked":"");c.dataset.tag=s.t;
   c.dataset.text=(s.id+" "+s.ko+" "+s.t+" "+s.u+" "+s.tr.join(" ")).toLowerCase();
   c.dataset.norm=c.dataset.text.replace(/[\s·・.\-_/]/g,"");
   c.innerHTML=`<div class="top"><span class="ko">${s.ko}</span><span class="tag" style="background:${TAGC[s.t]||"#5b6779"}">${s.t}</span>${s.p?`<span class="go">페이지 열기 →</span>`:""}<button class="infoB" title="호출 문구 보기">호출 문구 ▾</button></div><div class="use">${s.u}</div><div class="id">${s.id}</div><div class="more"><div class="lbl">이렇게 말하면 실행돼요</div><div class="trig">${s.tr.map(t=>`<span>"${t}"</span>`).join("")}</div>${s.p?`<a class="page" href="${s.p}" onclick="event.stopPropagation()">전용 페이지 열기 →</a>`:""}</div>`;
   c.onclick=()=>{if(s.p){window.location.href=s.p;}else{c.classList.toggle("open");}};
   c.querySelector(".infoB").onclick=e=>{e.stopPropagation();c.classList.toggle("open");};
   grid.appendChild(c);
  });
  gs.appendChild(sec);
  const a=document.createElement("a");a.href="#"+g.id;a.textContent=g.n.replace("GROUP ","G").split(" — ")[0]+" "+g.n.split(" — ")[1];a.style.background=g.c;toc.appendChild(a);
 });
 const chips=$("#tagchips");chips.innerHTML="";
 Object.keys(TAGC).forEach(t=>{
  const b=document.createElement("button");b.className="chip";b.textContent=t;
  b.onclick=()=>{tagFilter=(tagFilter===t)?null:t;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.textContent===tagFilter));apply();};
  chips.appendChild(b);
 });
 apply();
}
function apply(){
 const raw=$("#q").value.trim().toLowerCase();
 const q=raw, qn=raw.replace(/[\s·・.\-_/]/g,"");
 let shown=0;
 document.querySelectorAll(".card").forEach(c=>{
  const hit=!q||c.dataset.text.includes(q)||(qn&&c.dataset.norm.includes(qn));
  const ok=hit&&(!tagFilter||c.dataset.tag===tagFilter);
  c.classList.toggle("hidden",!ok);if(ok)shown++;
 });
 document.querySelectorAll(".group").forEach(g=>{
  const vis=g.querySelectorAll(".card:not(.hidden)").length;
  g.classList.toggle("hidden",vis===0);
  g.querySelector(".cnt").textContent=vis;
 });
 $("#noresult").style.display=shown?"none":"block";
 $("#stats").textContent=`총 ${S.length}개 스킬 · ${GROUPS.length}개 그룹`+(q||tagFilter?` · 표시 중 ${shown}개`:"");
}
$("#q").addEventListener("input",apply);
render();
</script>
