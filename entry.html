<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c111c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>진입 타이머 · Entry Timer</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c111c; --panel:#141c2b; --panel2:#1a2336; --line:#26314a;
  --ink:#e9eef7; --muted:#8896ae; --faint:#5d6b85;
  --navy-bright:#3a72d6; --orange:#E8621B; --orange-soft:#f08a4f;
  --buy:#f0454e; --setup:#3a72d6; --ext:#a855f7; --no:#5d6b85; --lowvol:#eab308;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Pretendard',sans-serif;font-size:14px;line-height:1.45}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
a{color:var(--muted);text-decoration:none}

header{display:flex;align-items:center;gap:14px;padding:12px 18px;flex-wrap:wrap;
  background:linear-gradient(180deg,#101827,#0c111c);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:baseline;gap:9px;white-space:nowrap}
.brand .ti{font-family:'JetBrains Mono';font-weight:700;font-size:20px;color:var(--orange);
  border:1.5px solid var(--orange);border-radius:6px;padding:1px 8px}
.brand h1{font-size:15px;font-weight:700}
.brand small{color:var(--faint);font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
.navlinks{margin-left:auto;display:flex;gap:14px;font-size:12.5px}
.navlinks a:hover{color:var(--ink)}

.container{max-width:1100px;margin:0 auto;padding:16px}

/* 설정 바 */
.settings{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.settings label{font-size:12px;color:var(--muted)}
.settings input,.settings select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  color:var(--ink);padding:7px 10px;font-size:13.5px;font-family:'JetBrains Mono';outline:none;width:130px}
.settings input:focus{border-color:var(--orange)}
.settings .unit{color:var(--faint);font-size:12px;margin-left:-4px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--ink);
  padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--orange);color:var(--orange-soft)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:700}
.btn.primary:hover{background:var(--orange-soft);color:#fff}

/* 검색 */
.searchwrap{position:relative;flex:1;min-width:220px}
#q{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  color:var(--ink);padding:9px 13px;font-size:14px;font-family:inherit;outline:none}
#q:focus{border-color:var(--orange)}
#q::placeholder{color:var(--faint)}
#qresults{position:absolute;top:calc(100% + 5px);left:0;right:0;background:var(--panel2);
  border:1px solid var(--line);border-radius:9px;overflow:hidden;display:none;z-index:50;
  box-shadow:0 10px 30px rgba(0,0,0,.5)}
#qresults .qi{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer}
#qresults .qi:hover{background:#232d44}
#qresults .qi .cd{font-family:'JetBrains Mono';font-size:11px;color:var(--faint);margin-left:auto}

/* 요약 스트립 */
.summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:12px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
.chip b{color:var(--ink)}
.chip.on-buy{border-color:var(--buy);color:var(--buy)}
.chip.on-setup{border-color:var(--setup);color:var(--setup)}

/* 카드 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative}
.card.v-BUY_POINT{border-color:var(--buy);box-shadow:0 0 0 1px var(--buy)}
.card.v-BUY_POINT_LOWVOL{border-color:var(--lowvol)}
.card.v-SETUP{border-color:var(--setup)}
.card .top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card .nm{font-weight:700;font-size:15px}
.card .cd{font-family:'JetBrains Mono';font-size:11px;color:var(--faint)}
.card .del{margin-left:auto;color:var(--faint);cursor:pointer;font-size:15px;padding:2px 6px}
.card .del:hover{color:var(--buy)}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:10px}
.b-BUY_POINT{background:rgba(240,69,78,.15);color:var(--buy)}
.b-BUY_POINT_LOWVOL{background:rgba(234,179,8,.12);color:var(--lowvol)}
.b-SETUP{background:rgba(58,114,214,.15);color:var(--setup)}
.b-EXTENDED{background:rgba(168,85,247,.13);color:var(--ext)}
.b-NO_SETUP{background:rgba(93,107,133,.15);color:var(--no)}
.row{display:flex;justify-content:space-between;padding:3.5px 0;font-size:13px;border-bottom:1px dashed rgba(38,49,74,.6)}
.row:last-child{border-bottom:0}
.row .k{color:var(--muted)}
.row .v{font-family:'JetBrains Mono';font-weight:500}
.dots{display:flex;gap:3px}
.dot{width:9px;height:9px;border-radius:50%;background:#26314a}
.dot.on{background:var(--orange)}
.pyr{font-size:11.5px;color:var(--muted);font-family:'JetBrains Mono';margin-top:6px;line-height:1.7}
.note{font-size:11.5px;color:var(--orange-soft);margin-top:7px;line-height:1.5}
.err{color:var(--buy);font-size:12.5px}
.loading{color:var(--faint);font-size:12.5px;padding:8px 0}
.empty{grid-column:1/-1;text-align:center;color:var(--faint);padding:60px 0;font-size:13.5px;line-height:2}
.disclaimer{margin-top:22px;text-align:center;color:var(--faint);font-size:11.5px;line-height:1.7;padding-bottom:30px}
@media(max-width:640px){.cards{grid-template-columns:1fr}.settings input{width:110px}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="ti">TI</span><h1>진입 타이머</h1><small>Entry Timer</small></div>
  <nav class="navlinks">
    <a href="cockpit.html">콕핏</a>
    <a href="gauge.html">온도계</a>
    <a href="stoploss.html">손절점검</a>
    <a href="index.html">홈</a>
  </nav>
</header>

<div class="container">
  <div class="settings">
    <div class="searchwrap">
      <input id="q" placeholder="종목명·코드 검색 후 추가 (예: 삼성전자)" autocomplete="off">
      <div id="qresults"></div>
    </div>
    <div><label>자본 </label><input id="capital" type="text" inputmode="numeric" value="10,000"><span class="unit">만원</span></div>
    <div><label>리스크 </label><input id="risk" type="number" step="0.1" min="0.1" max="5" value="1.0" style="width:64px"><span class="unit">%</span></div>
    <button class="btn primary" id="refreshAll">전체 점검 ↻</button>
  </div>

  <div class="summary" id="summary"></div>
  <div class="cards" id="cards"></div>

  <div class="disclaimer">
    판정 기준: 미너비니 트렌드 템플릿(7조건) → VCP 변동성 수축 / 다바스 박스 → 피벗 돌파(+거래량 1.5배) · 추격 한도 +5% · SETUP 근접 12%<br>
    사이징: 터틀 N(20일 ATR) — 1유닛 = 자본×리스크% ÷ 2N · 손절 2N · 피라미딩 +0.5N 간격 3회<br>
    본 신호는 규칙 기반 참고 자료이며, 매매 실행과 최종 판단의 책임은 이용자 본인에게 있습니다.
  </div>
</div>

<script>
const API = "/api/entry/analyze/";
const SEARCH = "/api/cockpit/search?q=";
const LS_WL = "et_watchlist", LS_CAP = "et_capital", LS_RISK = "et_risk";
const LABEL = {
  BUY_POINT: "🟢 매수 신호 — 돌파 유효",
  BUY_POINT_LOWVOL: "🟡 돌파 — 거래량 부족",
  SETUP: "🔵 셋업 완료 — 피벗 대기",
  EXTENDED: "🟣 추격 금지 — 피벗 +5% 초과",
  NO_SETUP: "⚪ 셋업 없음",
};
const fmt = n => n == null ? "-" : Math.round(n).toLocaleString("ko-KR");

let watchlist = JSON.parse(localStorage.getItem(LS_WL) || "[]");
const results = {};

/* ── 설정 ── */
const $cap = document.getElementById("capital"), $risk = document.getElementById("risk");
$cap.value = (+(localStorage.getItem(LS_CAP) || 10000)).toLocaleString("ko-KR");
$risk.value = localStorage.getItem(LS_RISK) || "1.0";
function capitalWon(){ return (parseFloat($cap.value.replace(/[^0-9.]/g,"")) || 0) * 10000; }
$cap.addEventListener("change", () => {
  const v = parseFloat($cap.value.replace(/[^0-9.]/g,"")) || 0;
  $cap.value = v.toLocaleString("ko-KR");
  localStorage.setItem(LS_CAP, v); renderAll();
});
$risk.addEventListener("change", () => { localStorage.setItem(LS_RISK, $risk.value); renderAll(); });

/* ── 검색 ── */
const $q = document.getElementById("q"), $qr = document.getElementById("qresults");
let qTimer = null;
$q.addEventListener("input", () => {
  clearTimeout(qTimer);
  const s = $q.value.trim();
  if (!s) { $qr.style.display = "none"; return; }
  qTimer = setTimeout(async () => {
    try {
      const j = await (await fetch(SEARCH + encodeURIComponent(s))).json();
      const items = (j.data || []).slice(0, 6);
      $qr.innerHTML = items.map(x =>
        `<div class="qi" data-code="${x.code}" data-name="${x.name}"><span>${x.name}</span><span class="cd">${x.code} · ${x.market||""}</span></div>`).join("");
      $qr.style.display = items.length ? "block" : "none";
    } catch(e) { $qr.style.display = "none"; }
  }, 250);
});
$qr.addEventListener("click", e => {
  const el = e.target.closest(".qi"); if (!el) return;
  addStock(el.dataset.code, el.dataset.name);
  $q.value = ""; $qr.style.display = "none";
});
document.addEventListener("click", e => { if (!e.target.closest(".searchwrap")) $qr.style.display = "none"; });

/* ── 관심종목 ── */
function saveWL(){ localStorage.setItem(LS_WL, JSON.stringify(watchlist)); }
function addStock(code, name){
  if (watchlist.some(w => w.code === code)) return;
  watchlist.push({ code, name }); saveWL(); renderAll(); loadOne(code);
}
function delStock(code){
  watchlist = watchlist.filter(w => w.code !== code);
  delete results[code]; saveWL(); renderAll();
}

/* ── 분석 호출 ── */
async function loadOne(code){
  results[code] = { loading: true }; renderAll();
  try {
    const j = await (await fetch(API + code)).json();
    results[code] = j.ok ? j.data : { error: j.error || "분석 실패" };
  } catch(e) { results[code] = { error: String(e) }; }
  renderAll();
}
document.getElementById("refreshAll").addEventListener("click", () => watchlist.forEach(w => loadOne(w.code)));

/* ── 사이징 (클라이언트 계산) ── */
function sizing(entry, atr){
  const cap = capitalWon(), riskPct = parseFloat($risk.value) || 1;
  if (!entry || !atr || !cap) return null;
  const shares = Math.floor(cap * riskPct / 100 / (2 * atr));
  if (shares < 1) return { shares: 0 };
  const pyr = [];
  let px = entry;
  for (let u = 2; u <= 4; u++) { px += 0.5 * atr; pyr.push(Math.round(px)); }
  return {
    shares, cost: shares * entry,
    stop: Math.round(entry - 2 * atr),
    stopPct: (2 * atr / entry * 100).toFixed(1),
    pyr,
  };
}

/* ── 렌더 ── */
function renderAll(){
  const $cards = document.getElementById("cards");
  if (!watchlist.length) {
    $cards.innerHTML = `<div class="empty">위 검색창에서 종목을 추가하세요.<br>스크리너(정배열·CANSLIM)에서 발굴한 후보를 넣으면<br>"지금이 살 자리인가"를 판정합니다.</div>`;
    document.getElementById("summary").innerHTML = ""; return;
  }
  const counts = {};
  const order = { BUY_POINT: 0, BUY_POINT_LOWVOL: 1, SETUP: 2, EXTENDED: 3, NO_SETUP: 4 };
  const sorted = [...watchlist].sort((a, b) => {
    const ra = results[a.code], rb = results[b.code];
    return (ra && ra.verdict != null ? order[ra.verdict] : 8) - (rb && rb.verdict != null ? order[rb.verdict] : 8);
  });
  $cards.innerHTML = sorted.map(w => {
    const r = results[w.code];
    let body = `<div class="loading">불러오는 중…</div>`;
    let vclass = "";
    if (r && r.error) body = `<div class="err">⚠ ${r.error}</div>`;
    else if (r && r.verdict) {
      vclass = "v-" + r.verdict;
      counts[r.verdict] = (counts[r.verdict] || 0) + 1;
      const tt = r.trend_template;
      const dots = Object.values(tt.checks).map(v => `<span class="dot${v ? " on" : ""}"></span>`).join("");
      const s = sizing(r.pivot || r.close, r.atr20);
      body = `
        <span class="badge b-${r.verdict}">${LABEL[r.verdict]}</span>
        <div class="row"><span class="k">현재가 <span style="font-size:10px">(${r.date})</span></span><span class="v">${fmt(r.close)}</span></div>
        ${r.pivot ? `<div class="row"><span class="k">피벗 매수가 (${r.pattern})</span><span class="v" style="color:var(--orange-soft)">${fmt(r.pivot)} <small>(${r.dist_to_pivot_pct > 0 ? "+" : ""}${r.dist_to_pivot_pct}%)</small></span></div>` : ""}
        <div class="row"><span class="k">추세 (트렌드 템플릿 ${tt.passed}/7)</span><span class="v dots">${dots}</span></div>
        ${r.vcp.found ? `<div class="row"><span class="k">VCP 수축</span><span class="v">${r.vcp.depths.join("→")}% · 거래량고갈 ${r.vcp.volume_dryup ? "O" : "X"}</span></div>` : ""}
        ${r.darvas.found ? `<div class="row"><span class="k">박스 (${r.darvas.days_in_box}일)</span><span class="v">${fmt(r.darvas.bottom)} ~ ${fmt(r.darvas.top)}</span></div>` : ""}
        ${s && s.shares > 0 ? `
        <div class="row"><span class="k">1유닛 (N=${fmt(r.atr20)})</span><span class="v">${s.shares.toLocaleString()}주 ≈ ${fmt(s.cost / 10000)}만원</span></div>
        <div class="row"><span class="k">손절 (2N)</span><span class="v" style="color:var(--setup)">${fmt(s.stop)} (-${s.stopPct}%)</span></div>
        <div class="pyr">피라미딩 +0.5N: ${s.pyr.map(fmt).join(" → ")}</div>` :
        (s ? `<div class="note">⚠ 자본·리스크 설정으로는 1주도 매수 불가</div>` : "")}
        ${(r.notes || []).map(n => `<div class="note">⚠ ${n}</div>`).join("")}`;
    }
    return `<div class="card ${vclass}">
      <div class="top"><span class="nm">${w.name}</span><span class="cd">${w.code}</span><span class="del" data-code="${w.code}">✕</span></div>
      ${body}</div>`;
  }).join("");
  $cards.querySelectorAll(".del").forEach(el => el.addEventListener("click", () => delStock(el.dataset.code)));

  const chip = (label, n, cls) => n ? `<span class="chip ${cls}"><b>${n}</b> ${label}</span>` : "";
  document.getElementById("summary").innerHTML =
    chip("매수 신호", counts.BUY_POINT, "on-buy") + chip("거래량 부족", counts.BUY_POINT_LOWVOL, "") +
    chip("셋업 대기", counts.SETUP, "on-setup") + chip("추격 금지", counts.EXTENDED, "") +
    chip("셋업 없음", counts.NO_SETUP, "");
}

renderAll();
watchlist.forEach(w => loadOne(w.code));
</script>
</body>
</html>
