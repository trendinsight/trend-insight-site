<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="방학 체크">
<title>연준 · 민준 방학 체크</title>
<style>
:root{
  --bg:#0b1020; --bg2:#131a33; --card:rgba(255,255,255,.055); --line:rgba(255,255,255,.11);
  --tx:#eef2ff; --tx2:#a8b3d6; --tx3:#6b769b;
  --acc:#ff9f43; --acc2:#ffd580; --ok:#31d0aa; --no:#ff6b81;
}
body.soccer{ --acc:#3ddc84; --acc2:#a8f5c8; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(255,159,67,.13), transparent 60%),
    radial-gradient(1000px 600px at 90% 0%, rgba(61,220,132,.10), transparent 55%),
    linear-gradient(180deg,#0b1020 0%,#0e1428 40%,#0a0f1e 100%);
  background-attachment:fixed; color:var(--tx); min-height:100vh;
  padding:0 0 80px;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* ===== 헤더 / 격언 ===== */
header{padding:26px 0 10px}
.brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:16px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 14px var(--acc)}
.brand h1{font-size:15px;letter-spacing:.22em;margin:0;color:var(--tx2);font-weight:600}
.sync{position:fixed;top:10px;right:12px;z-index:40;font-size:11px;font-weight:700;padding:6px 12px;border-radius:99px;
  border:1px solid var(--line);background:rgba(12,18,38,.85);backdrop-filter:blur(6px);color:var(--tx3);transition:.25s}
.sync.ok{color:#9fe8d4;border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.sync.busy{color:var(--acc2);border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.sync.off{color:#ffc9d1;border-color:color-mix(in srgb,var(--no) 50%,transparent)}
.quote{
  position:relative;border-radius:22px;padding:30px 26px 26px;text-align:center;overflow:hidden;
  background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
  border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.4);
}
.quote::before{content:"";position:absolute;inset:0;background:
  radial-gradient(600px 200px at 50% -30%, color-mix(in srgb,var(--acc) 26%,transparent), transparent 70%);pointer-events:none}
.quote .lbl{font-size:11px;letter-spacing:.28em;color:var(--acc2);margin-bottom:14px;font-weight:700}
.quote .txt{font-size:clamp(20px,3.6vw,32px);font-weight:800;line-height:1.42;margin:0 0 10px;letter-spacing:-.02em;
  animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.quote .sub{font-size:14px;color:var(--tx2);line-height:1.65;margin:0;animation:rise .8s .12s cubic-bezier(.2,.8,.2,1) both}
.quote .meta{margin-top:18px;font-size:12px;color:var(--tx3);letter-spacing:.05em}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ===== 탭 ===== */
.tabs{display:flex;gap:10px;justify-content:center;margin:22px 0 18px}
.tab{
  border:1px solid var(--line);background:var(--card);color:var(--tx2);cursor:pointer;
  padding:12px 26px;border-radius:999px;font-size:15px;font-weight:700;transition:.22s;display:flex;align-items:center;gap:8px;
  font-family:inherit
}
.tab:hover{color:var(--tx);border-color:rgba(255,255,255,.24)}
.tab.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#141a2b;border-color:transparent;box-shadow:0 8px 24px -6px var(--acc)}
.tab .ic{font-size:17px}

/* ===== 통계 ===== */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat .k{font-size:11px;color:var(--tx3);letter-spacing:.06em;margin-bottom:7px}
.stat .v{font-size:24px;font-weight:800;letter-spacing:-.02em}
.stat .v small{font-size:13px;color:var(--tx3);font-weight:600;margin-left:2px}
.bar{height:5px;border-radius:99px;background:rgba(255,255,255,.1);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .5s}

/* ===== 섹션 공통 ===== */
section{margin-bottom:26px}
.h{display:flex;align-items:baseline;gap:10px;margin:0 0 13px;padding:0 2px}
.h h2{font-size:17px;margin:0;font-weight:800;letter-spacing:-.01em}
.h span{font-size:12px;color:var(--tx3)}

/* ===== 오늘 카드 ===== */
.today{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;grid-template-columns:1fr 180px;gap:22px}
.today .date{font-size:13px;color:var(--acc2);font-weight:700;letter-spacing:.06em;margin-bottom:4px}
.today .dnum{font-size:22px;font-weight:800;margin-bottom:16px;letter-spacing:-.02em}
.grp{margin-bottom:14px}
.grp .gl{font-size:11px;color:var(--tx3);letter-spacing:.14em;margin-bottom:9px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--tx2);cursor:pointer;
  padding:9px 14px;border-radius:12px;font-size:13px;font-weight:600;transition:.16s;display:flex;align-items:center;gap:7px;
  font-family:inherit
}
.chip:hover{border-color:rgba(255,255,255,.3);transform:translateY(-1px)}
.chip .bx{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--tx3);display:grid;place-items:center;font-size:11px;color:transparent;transition:.16s}
.chip.on{background:color-mix(in srgb,var(--ok) 17%,transparent);border-color:color-mix(in srgb,var(--ok) 55%,transparent);color:#dffaf1}
.chip.on .bx{background:var(--ok);border-color:var(--ok);color:#08281f}
.chip .n{font-size:10px;color:var(--tx3);font-weight:700}
.ring{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.ring .gauge{position:relative;width:120px;height:120px}
.ring .gauge svg{transform:rotate(-90deg)}
.ring .gv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pc{font-size:26px;font-weight:800;line-height:1}
.ring .pl{font-size:11px;color:var(--tx3);margin-top:4px}
.rewardbox{text-align:center}

/* ===== 선수 카드 ===== */
.pcard{display:inline-flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.pcard.anim{animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{0%{opacity:0;transform:scale(.4) rotate(-14deg)}100%{opacity:1;transform:none}}
.pcard .nm{font-size:12px;font-weight:800;letter-spacing:-.01em}
.pcard .tm{font-size:10px;color:var(--tx3)}

/* ===== 최근 5일 ===== */
.recent{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.rc.done{border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 8%,var(--card))}
.rc.today{box-shadow:0 0 0 2px var(--acc) inset}
.rc .rh{display:flex;justify-content:space-between;align-items:center}
.rc .rd{font-size:13px;font-weight:800}
.rc .rd em{font-style:normal;color:var(--tx3);font-weight:600;font-size:11px;margin-left:4px}
.rc .rp{font-size:11px;font-weight:800;color:var(--acc2)}
.rc .face{display:flex;justify-content:center;padding:4px 0}
.mini{font-size:11px;line-height:1.6}
.mini .ttl{color:var(--tx3);font-size:10px;letter-spacing:.1em;font-weight:700;margin-bottom:4px}
.miss{display:flex;flex-wrap:wrap;gap:4px}
.miss button{
  border:1px dashed color-mix(in srgb,var(--no) 55%,transparent);background:color-mix(in srgb,var(--no) 11%,transparent);
  color:#ffc9d1;font-size:10.5px;padding:4px 8px;border-radius:8px;cursor:pointer;font-weight:600;font-family:inherit;transition:.15s
}
.miss button:hover{background:color-mix(in srgb,var(--ok) 22%,transparent);border-color:var(--ok);color:#dffaf1}
.okline{color:#9fe8d4;font-size:11px}
.rc .allok{text-align:center;font-size:11px;color:var(--ok);font-weight:700}

/* ===== 전체 표 ===== */
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:auto;max-height:620px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
th,td{padding:0;text-align:center;white-space:nowrap}
thead th{
  position:sticky;top:0;z-index:3;background:#151c33;border-bottom:1px solid var(--line);
  padding:9px 6px;font-size:10.5px;font-weight:700;color:var(--tx2);line-height:1.35;vertical-align:bottom
}
thead th .cyc{display:block;font-size:9px;color:var(--tx3);font-weight:600;margin-top:2px}
thead th.g2{color:var(--acc2)}
tbody td{border-bottom:1px solid rgba(255,255,255,.05);padding:3px 4px}
tbody tr:hover td{background:rgba(255,255,255,.03)}
tbody tr.sun td.dt{color:#ff8fa3}
tbody tr.sat td.dt{color:#8fb8ff}
tbody tr.today{background:color-mix(in srgb,var(--acc) 11%,transparent)}
tbody tr.full td{background:color-mix(in srgb,var(--ok) 8%,transparent)}
td.dt{text-align:left;padding-left:12px;font-weight:700;font-size:11.5px;position:sticky;left:0;background:#111730;z-index:2}
tbody tr.today td.dt{background:#2a2338}
td.dt em{font-style:normal;color:var(--tx3);font-weight:600;margin-left:5px;font-size:10px}
.cell{width:26px;height:26px;border-radius:8px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.03);
  cursor:pointer;display:inline-grid;place-items:center;font-size:12px;color:transparent;transition:.14s;font-family:inherit}
.cell:hover{border-color:var(--acc);transform:scale(1.12)}
.cell.on{background:var(--ok);border-color:var(--ok);color:#08281f;font-weight:900}
.cell.na{opacity:.16;cursor:default;border-style:dashed}
.cell.na:hover{transform:none;border-color:rgba(255,255,255,.13)}
.cell.fut{opacity:.35}
td.badge{width:56px}
td.badge .lock{opacity:.22;font-size:15px}

/* ===== 모달 ===== */
.mask{position:fixed;inset:0;background:rgba(4,7,16,.82);backdrop-filter:blur(7px);display:none;place-items:center;z-index:60;padding:20px}
.mask.on{display:grid}
.modal{background:linear-gradient(160deg,#1a2240,#111730);border:1px solid var(--line);border-radius:24px;padding:30px 28px;max-width:400px;width:100%;text-align:center;
  box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .4s cubic-bezier(.2,1.3,.4,1) both}
.modal h3{margin:16px 0 3px;font-size:23px;letter-spacing:-.02em}
.modal .team{color:var(--acc2);font-size:12.5px;font-weight:700;letter-spacing:.05em}
.modal p{color:var(--tx2);font-size:14px;line-height:1.72;margin:16px 0 0}
.modal .tag{display:inline-block;margin-top:16px;font-size:11px;color:var(--tx3);border:1px solid var(--line);padding:5px 12px;border-radius:99px}
.modal button{margin-top:20px;width:100%;padding:12px;border-radius:13px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#141a2b;font-weight:800;font-size:14px;font-family:inherit}

/* ===== 컬렉션 ===== */
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px;background:var(--card);
  border:1px solid var(--line);border-radius:18px;padding:18px}
.slot{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;border-radius:12px;transition:.15s}
.slot.got{cursor:pointer;background:rgba(255,255,255,.04)}
.slot.got:hover{background:rgba(255,255,255,.09);transform:translateY(-2px)}
.slot .sn{font-size:10.5px;font-weight:700;text-align:center;line-height:1.25}
.slot .sd{font-size:9px;color:var(--tx3)}
.slot.empty{opacity:.3}
.slot.empty .ph{width:52px;height:52px;border-radius:50%;border:1.5px dashed var(--tx3);display:grid;place-items:center;font-size:16px}

.foot{text-align:center;color:var(--tx3);font-size:11.5px;line-height:1.9;margin-top:30px}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:11px;color:var(--tx3);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:5px;vertical-align:-1px}

@media(max-width:820px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .today{grid-template-columns:1fr}
  .recent{grid-template-columns:1fr 1fr;}
  .quote{padding:24px 18px}
}
@media(max-width:520px){ .recent{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="sync" id="sync">연결 중…</div>
<div class="wrap">

<header>
  <div class="brand"><span class="dot"></span><h1>V A C A T I O N &nbsp; C H E C K</h1><span class="dot"></span></div>
  <div class="quote">
    <div class="lbl">오늘의 한 문장</div>
    <p class="txt" id="qTxt">—</p>
    <p class="sub" id="qSub">—</p>
    <div class="meta" id="qMeta"></div>
  </div>
</header>

<div class="tabs">
  <button class="tab on" data-who="연준"><span class="ic">⚾</span> 연준 <span style="font-size:11px;opacity:.75">야구선수 수집</span></button>
  <button class="tab" data-who="민준"><span class="ic">⚽</span> 민준 <span style="font-size:11px;opacity:.75">축구선수 수집</span></button>
</div>

<div class="stats" id="stats"></div>

<section>
  <div class="h"><h2>오늘 할 일</h2><span id="todayHint"></span></div>
  <div class="today" id="today"></div>
</section>

<section>
  <div class="h"><h2>최근 5일 경과</h2><span>못 한 항목을 누르면 지금이라도 체크됩니다</span></div>
  <div class="recent" id="recent"></div>
</section>

<section>
  <div class="h"><h2>42일 전체표</h2><span id="tableHint"></span></div>
  <div class="tablewrap"><table id="tbl"></table></div>
  <div class="legend">
    <span><i style="background:#31d0aa"></i>완료</span>
    <span><i style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2)"></i>미완료</span>
    <span><i style="background:transparent;border:1px dashed rgba(255,255,255,.3)"></i>해당 없는 날</span>
    <span>하루를 다 채우면 마지막 칸에 선수 얼굴이 들어옵니다</span>
  </div>
</section>

<section>
  <div class="h"><h2>선수 컬렉션</h2><span id="collHint"></span></div>
  <div class="coll" id="coll"></div>
</section>

<div class="foot">
  체크 기록은 이 브라우저에 자동 저장됩니다 · 언제든 다시 눌러서 켜고 끌 수 있어요<br>
  <span id="reset" style="cursor:pointer;text-decoration:underline">기록 전체 초기화</span>
</div>

</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>

<script>
/* ==== 데이터 ==== */
const START_DATE = '2026-07-26';   // 방학 시작(일요일)
const TOTAL_DAYS = 42;

const QUOTES = [
  ["시간은 가장 공평한 자산이다.", "누구에게나 하루는 똑같이 24시간. 차이는 그걸로 무엇을 했느냐에서 갈린다."],
  ["오늘 하루는 다시 오지 않는다.", "어제로 돌아갈 수 없고, 내일을 미리 쓸 수도 없다. 쓸 수 있는 건 지금뿐."],
  ["작은 습관이 큰 실력을 만든다.", "하루 1시간이 42일이면 42시간. 한 달 넘게 붙잡고 있던 셈이 된다."],
  ["미루는 순간, 시간은 이자를 붙인다.", "오늘 안 한 30분은 내일 1시간이 되어 돌아온다."],
  ["시작이 반이다.", "책을 펴는 데까지가 가장 어렵다. 펴고 나면 몸이 알아서 따라간다."],
  ["방학은 격차가 벌어지는 계절이다.", "학기 중엔 모두 같이 달리지만, 방학엔 각자 달린다."],
  ["계획표는 약속이다.", "누구와의 약속도 아닌, 나 자신과의 약속. 가장 지키기 쉬운 동시에 가장 깨기 쉬운 약속."],
  ["일찍 일어난 하루는 두 배로 길다.", "7시에 시작한 하루와 10시에 시작한 하루는 결국 다른 하루다."],
  ["집중한 1시간 > 흘려보낸 3시간.", "책상에 앉아 있던 시간이 아니라, 머리가 돌아간 시간이 실력이 된다."],
  ["오늘의 체크 하나가 내일의 자신감이다.", "동그라미는 점수가 아니라 증거다. '나는 해낸다'는 증거."],
  ["꾸준함은 재능을 이긴다.", "잘하는 사람은 매일 하는 사람을 이기지 못한다."],
  ["하기 싫은 날이 진짜 실력이 쌓이는 날이다.", "기분 좋을 때 하는 건 누구나 한다."],
  ["시간을 관리하면 인생이 관리된다.", "하루를 다스리는 사람이 결국 한 해를 다스린다."],
  ["끝내지 않은 일은 계속 힘을 뺏는다.", "미룬 숙제는 머릿속에서 하루 종일 나를 따라다닌다. 그냥 해치우는 게 편하다."],
  ["휴대폰에 준 시간은 돌려받지 못한다.", "10시에 폰을 내려놓는 건 손해가 아니라 다음 날을 저축하는 일이다."],
  ["매일 조금씩이 가장 빠른 길이다.", "몰아서 하는 열 시간보다 매일 한 시간이 멀리 간다."],
  ["오늘 못 한 건 내일 두 배가 된다.", "밀린 건 사라지지 않는다. 쌓일 뿐이다."],
  ["운동한 몸이 공부도 잘한다.", "머리는 몸 위에 얹혀 있다. 몸이 무거우면 머리도 무겁다."],
  ["기록하지 않으면 흘러간다.", "체크하지 않은 하루는 기억에서도 사라진다."],
  ["잘하는 게 아니라 끝내는 게 중요하다.", "완벽하게 하려다 못 끝내는 것보다, 끝내고 다음으로 가는 게 낫다."],
  ["방학 한 달은 학기 세 달의 힘이 있다.", "온전히 내 것인 시간이기 때문이다."],
  ["어제의 나와만 경쟁하면 된다.", "남과 비교하면 지치고, 어제와 비교하면 는다."],

  ["이재성","미드필더 · 대한민국","분데스리가에서 뛰며 활동량과 연계 플레이로 인정받았다."],
  ["파올로 말디니","수비수 · 이탈리아","AC밀란에서만 25년. 수비의 교과서로 불린다."],
  ["설기현","공격수 · 대한민국","2002년 이탈리아전 극적인 동점골을 넣고 유럽 무대로 진출했다."],
  ["프란츠 베켄바워","수비수 · 독일","'카이저'. 수비수가 공격을 시작하는 리베로의 개념을 만들었다."],
  ["김진수","풀백 · 대한민국","날카로운 왼발 크로스가 강점인 대표팀 왼쪽 수비수."],
  ["티에리 앙리","공격수 · 프랑스","아스날 무패 우승의 주역. 우아한 드리블과 마무리를 겸비했다."],
  ["최용수","공격수 · 대한민국","K리그 득점왕 출신 '독수리'. 선수와 감독 모두로 성공했다."],
  ["잔루이지 부폰","골키퍼 · 이탈리아","2006 월드컵 우승 골키퍼. 40대까지 최고 수준을 유지했다."],
  ["정우영","미드필더 · 대한민국","성실한 수비형 미드필더로 오랫동안 대표팀을 지탱했다."],
  ["스티븐 제라드","미드필더 · 잉글랜드","2005년 이스탄불의 기적을 이끈 리버풀의 캡틴."]
];

<script>
/* ================= 과제 정의 ================= */
const TASKS = [
  {id:'read', name:'리딩튜터',      detail:'읽고 → 풀고 → 강의 → 해설 → 단어', days:[1,2,3,4,5], grp:'학습', cnt:{'연준':'2개','민준':'1개'}, when:'월~금'},
  {id:'list', name:'듣기평가',      detail:'듣기 풀고 → 쉐도잉 → 해설·답 → 단어', days:[1,2,3,4,5], grp:'학습', cnt:{'연준':'2개','민준':'2개'}, when:'월~금'},
  {id:'voca', name:'거미줄영단어',  detail:'절반 → 절반 → 문제', days:[1,2,3,4,5], grp:'학습', cnt:{'연준':'절반','민준':'절반'}, when:'월~금'},
  {id:'gram', name:'포텐 영문법',   detail:'1개씩', days:[2,4,0], grp:'학습', cnt:{'연준':'1개','민준':'1개'}, when:'화·목·일'},
  {id:'m38',  name:'3800제',        detail:'3800제 + 중간기말', days:[2,4,0], grp:'학습', cnt:{'연준':'','민준':''}, when:'화·목·일'},
  {id:'mvoc', name:'말해보카',      detail:'매일 꾸준히', days:'all', grp:'학습', cnt:{'연준':'','민준':''}, when:'매일'},
  {id:'sci',  name:'과학공화국',    detail:'한 권 완독', days:'cycle', grp:'학습', cnt:{'연준':'2일 1권','민준':'3일 1권'}, when:{'연준':'2일에 1권','민준':'3일에 1권'}},
  {id:'wake', name:'7시 셀프기상',  detail:'알람 없이 스스로', days:'all', grp:'잘한 일'},
  {id:'mmal', name:'모닝 말보',     detail:'아침에 말해보카', days:'all', grp:'잘한 일'},
  {id:'duA',  name:'아침 오리',     detail:'아침 듀오링고', days:'all', grp:'잘한 일'},
  {id:'duP',  name:'저녁 오리',     detail:'저녁 듀오링고', days:'all', grp:'잘한 일'},
  {id:'phon', name:'10시 폰 놓기',  detail:'밤 10시엔 폰 끝', days:'all', grp:'잘한 일'},
  {id:'exer', name:'운동',          detail:'몸을 움직이기', days:'all', grp:'잘한 일'}
];
const SCI_CYCLE = {'연준':2,'민준':3};
const DOW = ['일','월','화','수','목','금','토'];

/* ================= 날짜 유틸 ================= */
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d;}
const DAYS = Array.from({length:TOTAL_DAYS},(_,i)=>{
  const d = addDays(START_DATE,i);
  return {i, date:ymd(d), dow:d.getDay(), md:(d.getMonth()+1)+'/'+d.getDate()};
});
const TODAY = ymd(new Date());
const todayIdx = DAYS.findIndex(d=>d.date===TODAY);
const curIdx = todayIdx>=0 ? todayIdx : (TODAY < START_DATE ? -1 : TOTAL_DAYS-1);

function applies(t, day, who){
  if(t.days==='all') return true;
  if(t.days==='cycle') return day.i % SCI_CYCLE[who] === 0;
  return t.days.includes(day.dow);
}
function dayTasks(day,who){ return TASKS.filter(t=>applies(t,day,who)); }

/* ================= 저장 ================= */
const KEY='vacation_check_v1';
let DB = JSON.parse(localStorage.getItem(KEY)||'{}');
['연준','민준'].forEach(w=>{ if(!DB[w]) DB[w]={}; });
function save(){ localStorage.setItem(KEY, JSON.stringify(DB)); }
function get(who,date,id){ return !!(DB[who][date] && DB[who][date][id]); }
function toggle(who,date,id){
  if(!DB[who][date]) DB[who][date]={};
  let v;
  if(DB[who][date][id]){ delete DB[who][date][id]; v=0; } else { DB[who][date][id]=1; v=1; }
  if(!Object.keys(DB[who][date]).length) delete DB[who][date];
  save(); queueOp(who,date,id,v);
}
/* ================= 서버 동기화 (가족 앨범 워커 R2) ================= */
const API='https://family-album.sungsangkyung77.workers.dev/api/vacation';
const KEYCODE='c3ec484ccf17';
const PKEY='vacation_pending_v1';
let pending = JSON.parse(localStorage.getItem(PKEY)||'[]');
let flushTimer=null, retryTimer=null, pulling=false;

function setSync(cls,txt){ const e=document.getElementById('sync'); if(e){ e.className='sync '+cls; e.textContent=txt; } }
function savePending(){ localStorage.setItem(PKEY, JSON.stringify(pending)); }

function queueOp(who,d,t,v){
  pending.push({who,d,t,v}); savePending();
  setSync('busy','저장 중…');
  clearTimeout(flushTimer); flushTimer=setTimeout(flush,600);
}

async function flush(){
  if(!pending.length){ setSync('ok','동기화됨'); return; }
  const batch=pending.slice(); const byWho={};
  batch.forEach(o=>{ (byWho[o.who]=byWho[o.who]||[]).push({d:o.d,t:o.t,v:o.v}); });
  try{
    for(const who of Object.keys(byWho)){
      const r=await fetch(API+'?k='+KEYCODE,{method:'PUT',headers:{'content-type':'application/json'},
        body:JSON.stringify({who, ops:byWho[who]})});
      if(!r.ok) throw new Error('HTTP '+r.status);
      await r.json();
    }
    pending = pending.slice(batch.length); savePending();
    setSync('ok', pending.length? '저장 중…' : '동기화됨');
    if(pending.length) flush();
  }catch(e){
    setSync('off','오프라인 — 이 기기에 저장됨');
    clearTimeout(retryTimer); retryTimer=setTimeout(flush,8000);
  }
}

async function pull(){
  if(pulling) return; pulling=true;
  try{
    const r=await fetch(API,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    ['연준','민준'].forEach(w=>{ DB[w]= (j.data && j.data[w]) ? j.data[w] : {}; });
    // 아직 서버에 못 보낸 내 변경분은 위에 다시 얹는다
    pending.forEach(o=>{
      if(o.v){ (DB[o.who][o.d]=DB[o.who][o.d]||{})[o.t]=1; }
      else if(DB[o.who][o.d]){ delete DB[o.who][o.d][o.t]; if(!Object.keys(DB[o.who][o.d]).length) delete DB[o.who][o.d]; }
    });
    save(); renderAll();
    setSync(pending.length?'busy':'ok', pending.length?'저장 중…':'동기화됨');
    if(pending.length) flush();
  }catch(e){
    setSync('off','오프라인 — 이 기기에 저장됨');
  }finally{ pulling=false; }
}

window.addEventListener('online', ()=>{ pull(); });
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) pull(); });
setInterval(()=>{ if(!document.hidden) pull(); }, 60000);

function dayDone(who,day){
  const ts=dayTasks(day,who);
  const n=ts.filter(t=>get(who,day.date,t.id)).length;
  return {n, total:ts.length, full: n===ts.length && ts.length>0};
}

/* ================= SVG 선수 얼굴 ================= */
const SKIN=['#f2c9a0','#e0aa7c','#c98b5e','#9c6640','#7a4a2c','#ffd9b8'];
const HAIRC=['#1c1410','#2b1d14','#3f2a18','#6b4423','#8b6b3d','#0f0f12','#4a3728'];
const JERSEY=[['#0d2b6b','#1b47a8'],['#8b1230','#c9203f'],['#0b5c3a','#128a55'],['#1a1a24','#3a3a4d'],
  ['#5b1f7a','#8a35b3'],['#c25a00','#f08a1c'],['#0f5f7a','#1a94b8'],['#7a1450','#b02075'],
  ['#12452b','#1d7a4a'],['#3b2a6b','#5b45a8'],['#a83a12','#d6602a'],['#0a3a5c','#156088']];
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return Math.abs(h);}
function face(seed, sport, size){
  const h=hash(seed);
  const sk=SKIN[h%SKIN.length], hc=HAIRC[(h>>3)%HAIRC.length];
  const jz=JERSEY[(h>>6)%JERSEY.length];
  const hair=(h>>9)%4, beard=(h>>12)%5===0, num=(h>>15)%99+1;
  const S=size, id='g'+h.toString(36);
  let head='';
  // 헤어
  if(hair===0) head+=`<path d="M28 40 q0-22 22-22 t22 22 q-6-9-22-9 t-22 9z" fill="${hc}"/>`;
  if(hair===1) head+=`<path d="M27 42 q1-25 23-25 t23 25 q-4-14-23-14 t-23 14z" fill="${hc}"/><path d="M27 42 q-3 12 1 18 q-6-8-1-18z" fill="${hc}"/><path d="M73 42 q3 12-1 18 q6-8 1-18z" fill="${hc}"/>`;
  if(hair===2) head+=`<ellipse cx="50" cy="34" rx="24" ry="17" fill="${hc}"/>`;
  if(hair===3) head+=`<path d="M29 41 q2-23 21-23 t21 23 q-8-11-21-6 t-21 6z" fill="${hc}"/><circle cx="50" cy="16" r="6" fill="${hc}"/>`;
  const wearCap = sport==='bb' && (h>>18)%5!==0;
  const sideHair = wearCap ? `<path d="M28 41 q-2 9 0 15 q-4-7-2-15z" fill="${hc}"/><path d="M72 41 q2 9 0 15 q4-7 2-15z" fill="${hc}"/>` : '';
  const cap = wearCap
    ? `${sideHair}<path d="M25 41 q2-25 25-25 t25 25 z" fill="${jz[0]}"/><path d="M25 41 q-11 1-13 6 q14 3 38 2 z" fill="${jz[1]}"/><circle cx="50" cy="18" r="3" fill="${jz[1]}"/>`
    : (sport==='sc' && h%3===0 ? `<path d="M27 40 q23-9 46 0 l0 5 q-23-8-46 0z" fill="${jz[1]}"/>` : '');
  return `<svg width="${S}" height="${S}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="${jz[1]}"/><stop offset="1" stop-color="${jz[0]}"/></linearGradient>
  <clipPath id="c${id}"><circle cx="50" cy="50" r="49"/></clipPath></defs>
  <g clip-path="url(#c${id})">
    <circle cx="50" cy="50" r="49" fill="url(#${id})"/>
    <circle cx="50" cy="50" r="49" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="2"/>
    <path d="M18 100 q4-24 32-28 h0 q28 4 32 28z" fill="${jz[0]}"/>
    <path d="M40 74 q10 9 20 0 l4 4 q-14 12-28 0z" fill="#fff" opacity=".9"/>
    <text x="50" y="97" font-size="15" font-weight="900" fill="rgba(255,255,255,.85)" text-anchor="middle" font-family="Arial">${num}</text>
    <path d="M32 46 q-5 0-5 6 t5 7z" fill="${sk}"/><path d="M68 46 q5 0 5 6 t-5 7z" fill="${sk}"/>
    <ellipse cx="50" cy="49" rx="21" ry="24" fill="${sk}"/>
    ${beard?`<path d="M31 52 q1 22 19 25 q18-3 19-25 q-6 16-19 16 t-19-16z" fill="${hc}" opacity=".85"/>`:''}
    ${head}${cap}
    <ellipse cx="42" cy="52" rx="2.6" ry="3.2" fill="#231b16"/><ellipse cx="58" cy="52" rx="2.6" ry="3.2" fill="#231b16"/>
    <circle cx="43" cy="51" r=".9" fill="#fff" opacity=".9"/><circle cx="59" cy="51" r=".9" fill="#fff" opacity=".9"/>
    <path d="M36.5 46 q5.5-2.8 10.5-1" stroke="${hc}" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M63.5 46 q-5.5-2.8-10.5-1" stroke="${hc}" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M42.5 62 q7.5 6 15 0" stroke="#6b3b2c" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <ellipse cx="36" cy="58" rx="3.4" ry="2.2" fill="#e8836b" opacity=".28"/>
    <ellipse cx="64" cy="58" rx="3.4" ry="2.2" fill="#e8836b" opacity=".28"/>
  </g></svg>`;
}

/* ================= 상태 ================= */
let WHO='연준';
const roster = ()=> WHO==='연준' ? BASEBALL : SOCCER;
const sport  = ()=> WHO==='연준' ? 'bb' : 'sc';
const $=(s)=>document.querySelector(s);

/* ================= 격언 ================= */
function renderQuote(){
  const idx = curIdx<0 ? 0 : curIdx;
  const q = QUOTES[idx % QUOTES.length];
  $('#qTxt').textContent = '"'+q[0]+'"';
  $('#qSub').textContent = q[1];
  const d=new Date();
  const dd = curIdx<0 ? '방학 시작 전' : ('방학 '+(curIdx+1)+'일차 · 남은 날 '+(TOTAL_DAYS-curIdx-1)+'일');
  $('#qMeta').textContent = `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일 · ${dd}`;
}

/* ================= 통계 ================= */
function renderStats(){
  let done=0, checked=0, total=0;
  DAYS.forEach(day=>{
    const r=dayDone(WHO,day);
    if(r.full) done++;
    checked+=r.n; total+=r.total;
  });
  // 이번 주 잘한 일
  const wStart = curIdx<0?0:Math.floor(curIdx/7)*7;
  let good=0;
  for(let i=wStart;i<Math.min(wStart+7,TOTAL_DAYS);i++){
    TASKS.filter(t=>t.grp==='잘한 일').forEach(t=>{ if(get(WHO,DAYS[i].date,t.id)) good++; });
  }
  // 연속
  let streak=0;
  for(let i=(curIdx<0?-1:curIdx);i>=0;i--){ if(dayDone(WHO,DAYS[i]).full) streak++; else break; }
  const pct = total? Math.round(checked/total*100):0;
  $('#stats').innerHTML=`
   <div class="stat"><div class="k">완료한 날 (선수 획득)</div><div class="v">${done}<small>/42일</small></div>
     <div class="bar"><i style="width:${done/42*100}%"></i></div></div>
   <div class="stat"><div class="k">전체 체크율</div><div class="v">${pct}<small>%</small></div>
     <div class="bar"><i style="width:${pct}%"></i></div>
     <div style="font-size:10px;color:var(--tx3);margin-top:5px">${checked} / ${total}칸</div></div>
   <div class="stat"><div class="k">연속 완주</div><div class="v">${streak}<small>일</small></div>
     <div style="font-size:10px;color:var(--tx3);margin-top:11px">하루라도 빠지면 0부터 다시</div></div>
   <div class="stat"><div class="k">이번 주 잘한 일 (목표 30)</div><div class="v">${good}<small>/30</small></div>
     <div class="bar"><i style="width:${Math.min(100,good/30*100)}%"></i></div>
     <div style="font-size:10px;color:${good>=30?'var(--ok)':'var(--tx3)'};margin-top:5px">${good>=30?'달성! 좋은 일 획득 🎉':'30개 모으면 좋은 일'}</div></div>`;
}

/* ================= 오늘 ================= */
function renderToday(){
  const box=$('#today');
  if(curIdx<0){ box.innerHTML='<div style="padding:20px;color:var(--tx2)">방학 시작 전입니다. '+START_DATE+'부터 시작해요.</div>'; $('#todayHint').textContent=''; return; }
  const day=DAYS[curIdx], ts=dayTasks(day,WHO), r=dayDone(WHO,day);
  const pct = r.total? r.n/r.total : 0;
  const C=2*Math.PI*46;
  const groups=['학습','잘한 일'].map(g=>{
    const items=ts.filter(t=>t.grp===g);
    if(!items.length) return '';
    return `<div class="grp"><div class="gl">${g==='학습'?'📚 공부':'⭐ 잘한 일'}</div><div class="chips">`+
      items.map(t=>{
        const on=get(WHO,day.date,t.id);
        const cnt = t.cnt && t.cnt[WHO] ? `<span class="n">${t.cnt[WHO]}</span>`:'';
        return `<button class="chip ${on?'on':''}" data-d="${day.date}" data-t="${t.id}" title="${t.detail}">
          <span class="bx">✓</span>${t.name}${cnt}</button>`;
      }).join('')+'</div></div>';
  }).join('');
  const p = roster()[day.i];
  const reward = r.full
    ? `<div class="rewardbox"><div class="pcard" data-p="${day.i}">${face(WHO+p[0],sport(),86)}
         <div class="nm">${p[0]}</div><div class="tm">${p[1]}</div></div>
       <div style="font-size:10px;color:var(--tx3);margin-top:6px">눌러서 소개 보기</div></div>`
    : `<div class="rewardbox" style="opacity:.45"><div style="font-size:40px">${sport()==='bb'?'⚾':'⚽'}</div>
       <div style="font-size:11px;color:var(--tx3);margin-top:6px">남은 ${r.total-r.n}칸을 채우면<br>오늘의 선수가 열립니다</div></div>`;
  box.innerHTML=`
    <div>
      <div class="date">${day.md} (${DOW[day.dow]}) · ${curIdx+1}일차</div>
      <div class="dnum" id="todayCount">오늘 ${r.n} / ${r.total} 완료</div>
      ${groups}
    </div>
    <div class="ring">
      <div class="gauge">
        <svg width="120" height="120"><circle cx="60" cy="60" r="46" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="9"/>
        <circle id="todayArc" cx="60" cy="60" r="46" fill="none" stroke="${r.full?'var(--ok)':'var(--acc)'}" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" style="transition:stroke-dashoffset .5s"/></svg>
        <div class="gv"><div class="pc" id="todayPct">${Math.round(pct*100)}%</div><div class="pl" id="todayLbl">${r.full?'오늘 완주!':'진행 중'}</div></div>
      </div>
      <div id="todayReward">${reward}</div>
    </div>`;
  $('#todayHint').textContent = `${day.md} (${DOW[day.dow]}) 기준`;
}

/* 오늘 카드의 게이지·보상만 갱신 (칩은 그대로 두어 클릭 흐름 유지) */
function updateToday(){
  if(curIdx<0 || !$('#todayArc')) return;
  const day=DAYS[curIdx], r=dayDone(WHO,day);
  const pct=r.total? r.n/r.total:0, C=2*Math.PI*46;
  $('#todayCount').textContent=`오늘 ${r.n} / ${r.total} 완료`;
  $('#todayPct').textContent=Math.round(pct*100)+'%';
  $('#todayLbl').textContent=r.full?'오늘 완주!':'진행 중';
  const arc=$('#todayArc');
  arc.setAttribute('stroke-dashoffset', C*(1-pct));
  arc.setAttribute('stroke', r.full?'var(--ok)':'var(--acc)');
  const box=$('#todayReward'), p=roster()[day.i];
  const has=!!box.querySelector('.pcard');
  if(r.full && !has){
    box.innerHTML=`<div class="rewardbox"><div class="pcard anim" data-p="${day.i}">${face(WHO+p[0],sport(),86)}
      <div class="nm">${p[0]}</div><div class="tm">${p[1]}</div></div>
      <div style="font-size:10px;color:var(--tx3);margin-top:6px">눌러서 소개 보기</div></div>`;
  }else if(!r.full && has){
    box.innerHTML=`<div class="rewardbox" style="opacity:.45"><div style="font-size:40px">${sport()==='bb'?'⚾':'⚽'}</div>
      <div style="font-size:11px;color:var(--tx3);margin-top:6px">남은 ${r.total-r.n}칸을 채우면<br>오늘의 선수가 열립니다</div></div>`;
  }else if(!r.full){
    const t=box.querySelector('div[style*="font-size:11px"]');
    if(t) t.innerHTML=`남은 ${r.total-r.n}칸을 채우면<br>오늘의 선수가 열립니다`;
  }
}

/* 표에서 한 행만 갱신 */
function updateRow(date){
  const tr=document.querySelector(`#tbl tr[data-date="${date}"]`); if(!tr) return;
  const day=DAYS.find(d=>d.date===date), r=dayDone(WHO,day), p=roster()[day.i];
  tr.classList.toggle('full', r.full);
  const b=tr.querySelector('td.badge');
  const has=!!b.querySelector('.pcard');
  if(r.full && !has) b.innerHTML=`<span class="pcard anim" data-p="${day.i}" title="${p[0]}">${face(WHO+p[0],sport(),40)}</span>`;
  else if(!r.full && has) b.innerHTML=`<span class="lock">${sport()==='bb'?'⚾':'⚽'}</span>`;
}

/* ================= 최근 5일 ================= */
function renderRecent(){
  const box=$('#recent');
  if(curIdx<0){ box.innerHTML=''; return; }
  const start=Math.max(0,curIdx-4);
  let html='';
  for(let i=start;i<=curIdx;i++){
    const day=DAYS[i], ts=dayTasks(day,WHO), r=dayDone(WHO,day);
    const missed=ts.filter(t=>!get(WHO,day.date,t.id));
    const p=roster()[i];
    html+=`<div class="rc ${r.full?'done':''} ${i===curIdx?'today':''}" data-date="${day.date}">
      <div class="rh"><div class="rd">${day.md}<em>${DOW[day.dow]}${i===curIdx?' · 오늘':''}</em></div>
        <div class="rp">${r.n}/${r.total}</div></div>
      ${r.full
        ? `<div class="face"><div class="pcard" data-p="${i}">${face(WHO+p[0],sport(),58)}<div class="nm">${p[0]}</div></div></div>
           <div class="allok">✓ 전부 완료 · 선수 획득</div>`
        : `<div class="mini"><div class="ttl">못 한 것 ${missed.length}개 — 누르면 체크</div>
           <div class="miss">${missed.map(t=>`<button data-d="${day.date}" data-t="${t.id}">${t.name}</button>`).join('')}</div></div>
           ${r.n?`<div class="okline">✓ ${ts.filter(t=>get(WHO,day.date,t.id)).map(t=>t.name).join(', ')}</div>`:''}`}
    </div>`;
  }
  box.innerHTML=html;
}

/* ================= 전체 표 ================= */
function renderTable(){
  const t=$('#tbl');
  let head='<thead><tr><th style="text-align:left;padding-left:12px;position:sticky;left:0;z-index:4;background:#151c33">날짜</th>';
  TASKS.forEach(k=>{
    const w = typeof k.when==='object'? k.when[WHO] : k.when;
    head+=`<th class="${k.grp==='잘한 일'?'g2':''}" title="${k.detail}">${k.name.replace(' ','<br>')}<span class="cyc">${w||'매일'}</span></th>`;
  });
  head+='<th>선수</th></tr></thead>';
  let body='<tbody>';
  DAYS.forEach(day=>{
    const r=dayDone(WHO,day);
    const cls=[day.dow===0?'sun':'',day.dow===6?'sat':'',day.date===TODAY?'today':'',r.full?'full':''].join(' ');
    body+=`<tr class="${cls}" data-date="${day.date}"><td class="dt">${day.md}<em>${DOW[day.dow]}</em></td>`;
    TASKS.forEach(k=>{
      if(!applies(k,day,WHO)){ body+='<td><span class="cell na"></span></td>'; return; }
      const on=get(WHO,day.date,k.id);
      const fut = day.i>curIdx ? 'fut':'';
      body+=`<td><button class="cell ${on?'on':''} ${fut}" data-d="${day.date}" data-t="${k.id}">✓</button></td>`;
    });
    const p=roster()[day.i];
    body+=`<td class="badge">${r.full
      ? `<span class="pcard" data-p="${day.i}" title="${p[0]}">${face(WHO+p[0],sport(),40)}</span>`
      : `<span class="lock">${sport()==='bb'?'⚾':'⚽'}</span>`}</td></tr>`;
  });
  t.innerHTML=head+body+'</tbody>';
  $('#tableHint').textContent = `${START_DATE} ~ ${DAYS[41].date} · 지난 날도 언제든 다시 체크 가능`;
}

/* ================= 컬렉션 ================= */
function renderColl(){
  const R=roster();
  let got=0, html='';
  DAYS.forEach(day=>{
    const full=dayDone(WHO,day).full; if(full) got++;
    const p=R[day.i];
    html+= full
      ? `<div class="slot got" data-p="${day.i}">${face(WHO+p[0],sport(),52)}<div class="sn">${p[0]}</div><div class="sd">${day.md}</div></div>`
      : `<div class="slot empty"><div class="ph">?</div><div class="sn">???</div><div class="sd">${day.md}</div></div>`;
  });
  $('#coll').innerHTML=html;
  $('#collHint').textContent = `${got} / 42명 획득 · 하루를 완주할 때마다 한 명씩 열립니다`;
}

/* ================= 모달 ================= */
function openPlayer(i){
  const p=roster()[i], day=DAYS[i];
  $('#modal').innerHTML=`${face(WHO+p[0],sport(),132)}
    <h3>${p[0]}</h3><div class="team">${p[1]}</div><p>${p[2]}</p>
    <div class="tag">${day.md} (${DOW[day.dow]}) 완주 보상 · ${i+1}번째 카드</div>
    <button onclick="document.getElementById('mask').classList.remove('on')">닫기</button>`;
  $('#mask').classList.add('on');
}
$('#mask').addEventListener('click',e=>{ if(e.target.id==='mask') e.currentTarget.classList.remove('on'); });

/* ================= 렌더 ================= */
function renderAll(){ renderStats(); renderToday(); renderRecent(); renderTable(); renderColl(); }

/* 한 칸 토글 — 표를 통째로 다시 그리지 않고 필요한 부분만 갱신 (스크롤 위치 유지) */
function hit(date,id){
  toggle(WHO,date,id);
  const on=get(WHO,date,id);
  document.querySelectorAll(`.cell[data-d="${date}"][data-t="${id}"], .chip[data-d="${date}"][data-t="${id}"]`)
    .forEach(el=>el.classList.toggle('on',on));
  updateRow(date); updateToday(); renderStats(); renderRecent(); renderColl();
}

document.addEventListener('click',e=>{
  const cell=e.target.closest('.cell:not(.na), .chip, .miss button');
  if(cell){ hit(cell.dataset.d,cell.dataset.t); return; }
  const pc=e.target.closest('.pcard, .slot.got');
  if(pc){ openPlayer(+pc.dataset.p); return; }
});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); WHO=b.dataset.who;
  document.body.classList.toggle('soccer', WHO==='민준');
  renderAll(); window.scrollTo({top:0,behavior:'smooth'});
}));
$('#reset').addEventListener('click',()=>{
  if(confirm('연준·민준 모든 체크 기록을 지웁니다. 모든 기기에서 지워집니다. 계속할까요?')){
    ['연준','민준'].forEach(w=>{
      Object.keys(DB[w]).forEach(d=>Object.keys(DB[w][d]).forEach(t=>pending.push({who:w,d,t,v:0})));
    });
    savePending(); DB={'연준':{},'민준':{}}; save(); renderAll(); flush();
  }
});

renderQuote(); renderAll(); pull();
</script>
</body>
</html>
