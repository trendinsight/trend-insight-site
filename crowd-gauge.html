<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>군중심리 온도계 — Trend Insight</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--line:#252a34;--txt:#e6e9ef;--sub:#9aa4b2;
        --frenzy:#e5484d;--hot:#f5a524;--neutral:#3e8ef7;--cold:#7c8598;--cap:#12b886;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}
  header{padding:22px 18px 8px;max-width:1040px;margin:0 auto}
  h1{font-size:21px;margin:0 0 4px}
  .sub{color:var(--sub);font-size:13px;line-height:1.5}
  .wrap{max-width:1040px;margin:0 auto;padding:12px 18px 60px}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;flex:1;min-width:280px}
  .card h2{font-size:15px;margin:0 0 2px}
  .meta{color:var(--sub);font-size:12px;margin-bottom:10px}
  .gauge{position:relative;width:220px;height:120px;margin:6px auto 2px}
  .temp{position:absolute;bottom:2px;left:0;right:0;text-align:center}
  .temp b{font-size:30px}.temp span{font-size:12px;color:var(--sub);display:block}
  .zone{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#0b0d10}
  .bars{margin-top:12px}
  .bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}
  .bar .lbl{width:104px;color:var(--sub);flex:none}
  .bar .track{flex:1;height:8px;background:#0c0e12;border-radius:6px;overflow:hidden}
  .bar .fill{height:100%;border-radius:6px}
  .bar .val{width:34px;text-align:right;color:var(--txt)}
  .flags{margin-top:10px;font-size:12px;color:var(--hot);line-height:1.5}
  .stocks{margin-top:20px}
  .schip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
          border-radius:10px;padding:10px 12px;margin:6px 8px 0 0;font-size:13px}
  .dot{width:10px;height:10px;border-radius:50%}
  .sq{font-size:11px;padding:2px 6px;border-radius:6px;font-weight:700}
  .ctrl{margin:6px 0 2px;font-size:13px;color:var(--sub)}
  select{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
  .doc{margin-top:26px;color:var(--sub);font-size:12px;line-height:1.7;border-top:1px solid var(--line);padding-top:14px}
  a{color:var(--neutral)}
</style>
</head>
<body>
<header>
  <h1>🌡️ 군중심리 온도계</h1>
  <div class="sub">주가가 아니라 <b>사람들이 남긴 흔적</b>(빚·돈·말·검색·공매도)으로 <b>지금 다들 얼마나 몰려 있는지</b>를 0~100 점수로 잰다.
  점수가 높으면 사람이 몰린 것, 낮으면 다들 떠난 것이다. <b>85점 위(너무 뜨거움)와 15점 아래(너무 차가움)에서만 신호로 쓰고</b>,
  그 사이(보통)에서는 다수가 대체로 맞으니 심리로 판단을 바꾸지 않는다.</div>
  <div class="ctrl">기준일 <select id="datesel"></select></div>
</header>
<div class="wrap">
  <div class="row" id="market"></div>
  <div class="stocks">
    <h2 style="font-size:15px;margin:22px 0 6px">해외 자산 — 사람들이 몰린 정도 <span style="color:var(--sub);font-weight:400;font-size:12px">다우 · 나스닥 · 금 · 암호화폐 · WTI · 미국채3년 · 한국국채3년</span></h2>
    <div class="row" id="global"></div>
  </div>
  <div class="stocks">
    <h2 style="font-size:15px;margin:18px 0 2px">내 종목 — 사람들이 몰린 정도 + 공매도 상태</h2>
    <div id="stocks"></div>
  </div>
  <div class="doc" id="doc"></div>
</div>
<script>
const LBL={'레버리지 수위':'빚 규모','레버리지 모멘텀':'빚 늘어나는 속도','개인 매수 강도':'개인이 사는 힘',
 '거래 열기':'거래 활발함','검색 관심도':'검색 관심','종토방 버즈':'게시판 수다','개인 쏠림':'개인 몰림',
 '포지션 쏠림':'큰손 베팅 몰림','변동성 안도감':'시장 안심도','공포·탐욕':'공포/탐욕','펀딩비 쏠림':'선물 롱 몰림'};
const MEAN={dow:'미국 대표 대기업 주식이 오른다는 쪽에 몰린 정도',nasdaq:'미국 기술주가 오른다는 쪽에 몰린 정도',
 gold:'금값이 오른다는 쪽에 몰린 정도',crypto:'비트코인이 오른다는 쪽에 몰린 정도',wti:'기름값이 오른다는 쪽에 몰린 정도',
 ust3y:'미국 국채값이 오른다(=미국 금리가 내린다)는 쪽에 몰린 정도',
 ktb3y:'한국 국채값이 오른다(=한국 금리가 내린다)는 쪽에 몰린 정도'};
const ZC={FRENZY:'var(--frenzy)',HOT:'var(--hot)',NEUTRAL:'var(--neutral)',COLD:'var(--cold)',CAPITULATION:'var(--cap)'};
const ZK={FRENZY:'너무 뜨거움',HOT:'뜨거움',NEUTRAL:'보통',COLD:'차가움',CAPITULATION:'너무 차가움'};
const SQK={SQUEEZE_WATCH:['공매도 되사기 주의','var(--frenzy)'],HEAVY_SHORT:['공매도 많음','var(--hot)'],LIGHT_SHORT:['공매도 적음','var(--cold)']};
let DATA=null;

function gauge(t){ // 반원 게이지 SVG
  const a=Math.PI*(1-t/100), cx=110,cy=110,r=92;
  const x=cx+r*Math.cos(a), y=cy-r*Math.sin(a);
  const col=t>=85?ZC.FRENZY:t>=70?ZC.HOT:t>30?ZC.NEUTRAL:t>15?ZC.COLD:ZC.CAPITULATION;
  return `<svg width="220" height="120" viewBox="0 0 220 120">
    <path d="M18 110 A92 92 0 0 1 202 110" fill="none" stroke="#0c0e12" stroke-width="14" stroke-linecap="round"/>
    <path d="M18 110 A92 92 0 0 1 202 110" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round"
      stroke-dasharray="${Math.PI*92}" stroke-dashoffset="${Math.PI*92*(1-t/100)}"/>
    <circle cx="${x}" cy="${y}" r="7" fill="${col}"/></svg>`;
}
function barColor(v){return v>=85?ZC.FRENZY:v>=70?ZC.HOT:v>30?ZC.NEUTRAL:v>15?ZC.COLD:ZC.CAPITULATION;}

function renderMarket(date){
  const host=document.getElementById('market'); host.innerHTML='';
  for(const key of ['kospi','kosdaq']){
    const hist=(DATA.market&&DATA.market[key])||[];
    const rec=hist.find(r=>r.date===date)||hist[hist.length-1];
    if(!rec){continue;}
    const col=ZC[rec.zone]||ZC.NEUTRAL;
    let bars='';
    for(const[k,v]of Object.entries(rec.components||{})){
      bars+=`<div class="bar"><span class="lbl">${LBL[k]||k}</span><span class="track"><span class="fill" style="width:${v}%;background:${barColor(v)}"></span></span><span class="val">${Math.round(v)}</span></div>`;
    }
    const flags=(rec.flags||[]).map(f=>`⚠ ${f}`).join('<br>');
    host.innerHTML+=`<div class="card"><h2>${rec.name||key.toUpperCase()}</h2>
      <div class="meta">기준일 ${rec.date} · 신용융자 ${rec.loan??'-'}조 · 예탁금 ${rec.deposit??'-'}조</div>
      <div class="gauge">${gauge(rec.temp)}<div class="temp"><b style="color:${col}">${rec.temp}</b>
      <span class="zone" style="background:${col}">${ZK[rec.zone]||rec.zone}</span></div></div>
      <div class="bars">${bars}</div>${flags?`<div class="flags">${flags}</div>`:''}</div>`;
  }
}
const GORDER=['dow','nasdaq','gold','crypto','wti','ust3y','ktb3y'];
function renderGlobal(date){
  const host=document.getElementById('global'); host.innerHTML='';
  const g=DATA.global||{};
  const keys=GORDER.filter(k=>g[k]).concat(Object.keys(g).filter(k=>!GORDER.includes(k)));
  if(!keys.length){host.innerHTML='<div class="sub">글로벌 자산 데이터 없음 — crowd_global.py 실행 시 누적됩니다.</div>';return;}
  for(const key of keys){
    const hist=g[key]||[];
    const rec=hist.find(r=>r.date===date)||hist[hist.length-1];
    if(!rec)continue;
    const col=ZC[rec.zone]||ZC.NEUTRAL;
    let bars='';
    for(const[k,v]of Object.entries(rec.components||{})){
      bars+=`<div class="bar"><span class="lbl">${LBL[k]||k}</span><span class="track"><span class="fill" style="width:${v}%;background:${barColor(v)}"></span></span><span class="val">${Math.round(v)}</span></div>`;
    }
    const cx=rec.context||{};
    const lines=['cot','volume','vol_idx','trends','fng','funding','indi'].filter(k=>cx[k]).map(k=>`· ${cx[k]}`).join('<br>');
    host.innerHTML+=`<div class="card"><h2>${rec.name||key}</h2>
      <div class="meta">기준일 ${rec.date}${cx.last!=null?` · 최근 ${(+cx.last).toLocaleString()}`:''}</div>
      <div class="gauge">${gauge(rec.temp)}<div class="temp"><b style="color:${col}">${rec.temp}</b>
      <span class="zone" style="background:${col}">${ZK[rec.zone]||rec.zone}</span></div></div>
      <div class="sub" style="font-size:11.5px;margin-top:6px">점수가 높을수록 → ${MEAN[key]||rec.meaning||'오른다는 쪽에 몰린 정도'}</div>
      <div class="bars">${bars}</div>
      ${lines?`<div class="sub" style="font-size:11px;margin-top:8px;line-height:1.6">${lines}</div>`:''}</div>`;
  }
}
function renderStocks(date){
  const host=document.getElementById('stocks'); host.innerHTML='';
  const st=DATA.stocks||{};
  const keys=Object.keys(st);
  if(!keys.length){host.innerHTML='<div class="sub" style="margin-top:8px">등록된 종목 없음 — 스킬 실행 시 누적됩니다.</div>';return;}
  for(const code of keys){
    const o=st[code], rec=(o.history||[]).find(r=>r.date===date)||o.history[o.history.length-1];
    if(!rec)continue;
    const col=ZC[rec.zone]||ZC.NEUTRAL;
    let sq='';
    if(rec.squeeze&&SQK[rec.squeeze]){sq=`<span class="sq" style="background:${SQK[rec.squeeze][1]};color:#0b0d10">${SQK[rec.squeeze][0]}</span>`;}
    host.innerHTML+=`<span class="schip"><span class="dot" style="background:${col}"></span>
      <b>${o.name||code}</b> ${rec.temp} <span style="color:var(--sub)">${ZK[rec.zone]||rec.zone}</span> ${sq}</span>`;
  }
}
function rebuildDates(){
  const set=new Set();
  for(const k of ['kospi','kosdaq'])((DATA.market&&DATA.market[k])||[]).forEach(r=>set.add(r.date));
  Object.values(DATA.global||{}).forEach(h=>(h||[]).forEach(r=>set.add(r.date)));
  Object.values(DATA.stocks||{}).forEach(o=>(o.history||[]).forEach(r=>set.add(r.date)));
  const dates=[...set].sort().reverse();
  const sel=document.getElementById('datesel'); sel.innerHTML='';
  dates.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;sel.appendChild(o);});
  sel.onchange=()=>{renderMarket(sel.value);renderGlobal(sel.value);renderStocks(sel.value);};
  return dates[0];
}
document.getElementById('doc').innerHTML=
 `<b>읽는 법 — 점수의 뜻</b><br>
  모든 점수는 <b>0~100점</b>이고, 값 자체가 아니라 <b>지난 1년(큰손 베팅은 3년) 중 어디쯤인지</b>를 나타낸다.
  100에 가까우면 1년 중 가장 몰린 상태, 0에 가까우면 1년 중 가장 비어 있는 상태다. 온도는 이 점수들의 평균이다.<br><br>
  <b>용어 풀이</b><br>
  · <b>빚 규모</b> — 사람들이 빚내서 산 돈(신용융자)이 예탁금 대비 얼마나 쌓였나<br>
  · <b>빚 늘어나는 속도</b> — 그 빚이 최근 한 달 새 늘고 있나 줄고 있나 (낮으면 빚을 갚는 중)<br>
  · <b>개인이 사는 힘 / 개인 몰림</b> — 개인 투자자가 최근 얼마나 순매수했나<br>
  · <b>거래 활발함</b> — 거래량이 평소보다 많은가 적은가<br>
  · <b>게시판 수다</b> — 종목토론방 글이 평소보다 얼마나 늘었나 (좋은 말·나쁜 말 구분 없음)<br>
  · <b>검색 관심</b> — 구글에서 얼마나 많이 검색되나<br>
  · <b>큰손 베팅 몰림</b> — 해외 선물시장에서 전문 투자자금이 사자 쪽에 얼마나 몰렸나 (주 1회 집계라 며칠 늦다)<br>
  · <b>시장 안심도</b> — 불안지수(VIX 등)를 뒤집은 값. 높으면 마음 놓은 상태, 낮으면 불안해하는 중<br>
  · <b>공포/탐욕</b> — 코인 시장 심리 지수. 0은 공포, 100은 탐욕<br>
  · <b>선물 롱 몰림</b> — 코인 선물에서 오른다에 건 쪽이 무는 수수료. 마이너스면 내린다에 건 쪽이 더 많다는 뜻<br>
  · <b>공매도 되사기 주의</b> — 빌려서 판 물량(공매도)이 많이 쌓였는데 개인·관심까지 몰린 상태.
    주가가 오르면 빌린 쪽이 급히 되사면서 더 오를 수 있다<br><br>
  <b>주의</b> — 국채 카드는 점수가 높을수록 "금리가 내린다"에 건 사람이 많다는 뜻이다.
  이 점수는 참고용이며 이것만 보고 사고팔지 않는다. 가격이 비싼지 싼지는 <a href="gauge.html">시장 온도계</a>와 함께 봐야 한다.`;
fetch('./data/crowd-gauge.json?cb='+Date.now()).then(r=>r.json()).then(d=>{
  DATA=d; const last=rebuildDates(); renderMarket(last); renderGlobal(last); renderStocks(last);
}).catch(e=>{document.getElementById('market').innerHTML='<div class="sub">데이터를 불러오지 못했습니다.</div>';});
</script>
</body>
</html>
