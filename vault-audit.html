<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>볼트 감사 보드 | Trend Insight</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box}
body{font-family:'Pretendard',sans-serif;margin:0;color:#1c2533;line-height:1.7;background:#f5f7fb}
header{background:#0b1f3f;padding:16px 24px;font-weight:800;display:flex;gap:16px;align-items:center}
header a{color:#fff;text-decoration:none}
header .sub{color:#9fb3d1;font-weight:500;font-size:.85rem}
main{max-width:1060px;margin:0 auto;padding:32px 20px 60px}
h1{color:#7c3aed;font-size:1.45rem;margin:0 0 4px}
.desc{color:#5b6779;font-size:.9rem;margin-bottom:20px}
.dates{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.dbtn{border:1px solid #d5dde9;background:#fff;border-radius:999px;padding:5px 13px;font-size:.82rem;cursor:pointer;font-family:inherit;color:#3c4757;font-weight:600}
.dbtn.on{background:#7c3aed;border-color:#7c3aed;color:#fff}
.entry{background:#fff;border:1px solid #e4e9f1;border-radius:14px;padding:26px 28px}
.entry h2{color:#0b1f3f;font-size:1.15rem;margin:0 0 6px}
.entry .meta{color:#9aa6b6;font-size:.8rem;margin-bottom:14px}
.entry .summary{background:#f5f7fb;border-left:4px solid #7c3aed;border-radius:6px;padding:12px 16px;font-size:.92rem;color:#3c4757;margin-bottom:18px}
.entry .body h3{color:#13294b;margin-top:24px}
.entry .body table{border-collapse:collapse;width:100%;margin:14px 0;font-size:.88rem}
.entry .body th,.entry .body td{border:1px solid #e4e9f1;padding:7px 10px;text-align:left}
.entry .body th{background:#f0f4fa}
.empty{background:#fff;border:1.5px dashed #cfd8e5;border-radius:14px;padding:46px 24px;text-align:center;color:#5b6779}
.empty b{color:#7c3aed}
.empty code{background:#f0f4fa;border-radius:6px;padding:3px 9px;font-size:.9rem;color:#0b1f3f}
.disclaimer{margin-top:34px;padding-top:14px;border-top:1px solid #e4e9f1;font-size:.76rem;color:#9aa6b6}
</style>
</head>
<body>
<header><a href="index.html">← Trend Insight</a><a href="skill-map.html">🧭 스킬 맵</a><span class="sub">볼트 감사 보드</span></header>
<main>
<h1>볼트 감사 보드</h1>
<div class="desc">옵시디언 볼트 규격(프런트매터·폴더·허브) 점검 결과 · 날짜별 누적 게시</div>
<div class="dates" id="dates"></div>
<div id="content"></div>
<p class="disclaimer">본 자료는 투자 참고용이며 특정 종목의 매수·매도를 권유하지 않습니다. 투자의 최종 판단과 책임은 투자자 본인에게 있습니다.</p>
</main>
<script>
const DATA_URL="data/vault-audit.json";
async function load(){
 let d={entries:[]};
 try{const r=await fetch(DATA_URL+"?t="+Date.now());if(r.ok)d=await r.json();}catch(e){}
 const es=(d.entries||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
 const dates=document.getElementById("dates"),content=document.getElementById("content");
 if(!es.length){
  content.innerHTML='<div class="empty">아직 게시된 결과가 없습니다.<br><br>클로드에게 <code>"볼트 점검해서 게시해줘"</code> 라고 요청하면<br>이 페이지에 <b>날짜별로 결과가 쌓입니다</b>.</div>';
  return;
 }
 function show(i){
  const e=es[i];
  [...dates.children].forEach((b,j)=>b.classList.toggle("on",j===i));
  content.innerHTML=`<div class="entry"><h2>${e.title||""}</h2><div class="meta">${e.date}</div>${e.summary?`<div class="summary">${e.summary}</div>`:""}<div class="body">${e.html||""}</div></div>`;
 }
 es.forEach((e,i)=>{
  const b=document.createElement("button");b.className="dbtn";b.textContent=e.date;
  b.onclick=()=>show(i);dates.appendChild(b);
 });
 show(0);
}
load();
</script>
</body>
</html>
