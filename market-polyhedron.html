<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>산업 다면체 지도 — Trend Insight</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--bg:#070b1a;--card:#121829;--card2:#0d1222;--line:#232b42;--txt:#e8ecf5;--sub:#93a0bb;
        --up:#e5484d;--dn:#3b82f6;--flat:#3a4258;--acc:#ff7a45;--good:#12b886;--warn:#f5a524}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);overflow:hidden;
       font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",sans-serif;
       -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  button{font-family:inherit}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  #top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);
       background:rgba(7,11,26,.86);z-index:5}
  #top h1{font-size:16px;margin:0;font-weight:800;white-space:nowrap}
  #top h1 a{color:inherit;text-decoration:none}
  #crumb{font-size:13px;color:var(--sub);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  #crumb b{color:var(--txt)}

  .seg button.on{background:#24304f;color:#fff}
  .tbtn{background:#18203a;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:6px 11px;
        font-size:12.5px;font-weight:700;cursor:pointer}
  .tbtn:hover{border-color:#4767b8}
  #sbox{position:relative;flex:1 1 220px;max-width:340px;min-width:170px}
  #sq{width:100%;background:#0c1226;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:13.5px;font-family:inherit}
  #sq:focus{outline:none;border-color:#4767b8}
  #sres{position:absolute;left:0;right:0;top:calc(100% + 5px);background:#0d1326;border:1px solid var(--line);border-radius:11px;
        max-height:min(64vh,460px);overflow:auto;z-index:30;display:none;box-shadow:0 18px 40px rgba(0,0,0,.5);min-width:280px}
  #sres .hd{font-size:10.5px;color:var(--sub);padding:8px 11px 3px;font-weight:700;letter-spacing:.3px}
  #sres .it{padding:7px 11px;font-size:13px;cursor:pointer;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
  #sres .it small{color:var(--sub);font-size:11px;white-space:nowrap}
  #sres .it.on,#sres .it:hover{background:#1d2745}
  #sres .none{padding:12px;font-size:12.5px;color:var(--sub);line-height:1.6}
  #hot{position:absolute;top:10px;right:12px;bottom:62px;width:clamp(340px,27vw,440px);display:none;flex-direction:column;gap:12px;z-index:6}
  #hot.show{display:flex}
  #hot .hb{flex:1 1 0;min-height:0;display:flex;flex-direction:column;background:rgba(13,19,38,.88);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  #hot .hh{padding:12px 16px 9px;border-bottom:1px solid var(--line)}
  #hot .hh b{font-size:17px;display:block}
  #hot .hh small{font-size:12.5px;color:#aab6cf;line-height:1.5;display:block;margin-top:2px}
  #hot .hl{overflow:auto;flex:1}
  #hot .hr{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:3px 10px;align-items:baseline;padding:8px 16px 7px;cursor:pointer;border-bottom:1px solid rgba(35,43,66,.6)}
  #hot .hr:hover{background:#1d2745}
  #hot .hr i{font-style:normal;font-size:13.5px;color:var(--sub);text-align:right}
  #hot .hr .n{font-size:16.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #hot .hr .p{font-size:16.5px;font-weight:800;text-align:right}
  #hot .hr .d{grid-column:2/4;font-size:13.5px;color:#aab6cf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #hot .he{padding:16px;font-size:14px;color:var(--sub);line-height:1.6}
  @media(max-width:900px){#hot{left:12px;width:auto;top:8px;background:transparent}}
  #asof{font-size:11.5px;color:var(--sub);white-space:nowrap}
  #stage{position:relative;flex:1;min-height:0}
  #stars,#poly{position:absolute;inset:0;width:100%;height:100%;display:block}
  #poly{cursor:grab;touch-action:none}

  #hint{position:absolute;left:0;right:0;bottom:64px;text-align:center;font-size:12.5px;color:var(--sub);pointer-events:none}
  #chips{position:absolute;left:0;right:0;bottom:10px;display:flex;gap:6px;padding:0 12px;overflow-x:auto;scrollbar-width:thin}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:rgba(18,24,41,.9);color:var(--txt);border-radius:999px;
        padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer;display:flex;gap:6px;align-items:center}
  .chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .chip.on{border-color:#fff}
  #tip{position:absolute;pointer-events:none;background:rgba(10,14,28,.96);border:1px solid var(--line);border-radius:10px;
       padding:9px 11px;font-size:12px;line-height:1.6;z-index:8;display:none;max-width:260px}
  #tip b{font-size:13.5px}
  /* 마켓맵 */
  #map{position:absolute;inset:0;display:none;background:var(--bg);overflow:hidden;touch-action:none;cursor:default}
  #map.show{display:block;animation:zin .38s ease-out}
  @keyframes zin{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:scale(1)}}
  .tile{position:absolute;overflow:hidden;border:1px solid rgba(7,11,26,.9);cursor:pointer;display:flex;flex-direction:column;
        align-items:center;justify-content:center;text-align:center;color:#fff;line-height:1.15;user-select:none}
  .tile:hover{outline:2px solid #fff;outline-offset:-2px;z-index:2}

  #legend{position:absolute;right:12px;bottom:10px;display:flex;align-items:center;gap:0;font-size:10.5px;z-index:4;

  #memo{position:absolute;top:8px;right:12px;width:min(430px,calc(100% - 24px));max-height:72%;overflow:auto;z-index:25;display:none;
        background:#0d1326;border:1px solid var(--line);border-radius:14px;padding:2px 12px 6px;box-shadow:0 18px 40px rgba(0,0,0,.55)}
  #memo.show{display:block}
  #chart{width:100%;height:240px;display:block;background:var(--card2);border:1px solid var(--line);border-radius:10px}
  .bar52{height:8px;border-radius:5px;background:linear-gradient(90deg,#3b82f6,#3a4258,#e5484d);position:relative;margin:8px 2px 2px}
  .bar52 i{position:absolute;top:-4px;width:4px;height:16px;background:#fff;border-radius:2px;transform:translateX(-2px)}
  .links{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:7px}
  .links a{display:block;background:#18203a;border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--txt);
           text-decoration:none;font-size:12.5px;font-weight:700}
  .links a small{display:block;font-weight:500;color:var(--sub);font-size:10.8px;margin-top:2px}

  table.peer{width:100%;border-collapse:collapse;font-size:12px}
  table.peer th,table.peer td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  table.peer th:first-child,table.peer td:first-child{text-align:left}
  table.peer th{color:var(--sub);font-weight:600}
  table.peer tr.me td{background:#1d2745;font-weight:800}
  table.peer tr{cursor:pointer}
  .up{color:#ff6b6f}.dn{color:#6ea4ff}
  .note{font-size:11px;color:var(--sub);line-height:1.6;margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
  #load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:14px;z-index:20;
        background:var(--bg);text-align:center;padding:20px;line-height:1.7}
  @media(max-width:640px){#top h1{font-size:14.5px}.kv{grid-template-columns:repeat(4,1fr)}#hint{bottom:58px;font-size:11.5px}
    #panel{width:100%;top:auto;height:82%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(102%)}}
</style>

<body>
<div id="app">
  <div id="top">
    <h1><a href="index.html">🧊 산업 다면체 지도</a></h1>
    <div id="crumb"></div>

    <div id="sbox"><input id="sq" type="search" placeholder="테마·업종·종목 검색 (예: 로봇 관련주)" autocomplete="off"><div id="sres"></div></div>
    <div class="seg" id="period">
      <button data-p="d1" class="on">1일</button><button data-p="w1">1주</button><button data-p="m1">1개월</button><button data-p="m3">3개월</button>

      <div class="hb"><div class="hh"><b>🔺 상승률 + 거래량 급증 10</b><small id="hot-up-m">상승률 상위 중 거래량이 20일 평균의 1.5배 이상 · 거래대금 30억 이상</small></div><div class="hl" id="hot-up"></div></div>
      <div class="hb"><div class="hh"><b>💬 논쟁 중인 10</b><small id="hot-tk-m">인기검색 50종목 중 종목토론방 글이 가장 빠르게 올라오는 순</small></div><div class="hl" id="hot-tk"></div></div>
    </aside>
    <div id="map"><div id="tiles"></div>
      <div id="zoomctl"><button class="tbtn" id="zin">＋</button><button class="tbtn" id="zout">－</button><button class="tbtn" id="zreset">맞춤</button></div>

    <div id="load">지도 데이터를 불러오는 중…</div>
  </div>
</div>
<script>
/*__INLINE_DATA__*/
(function(){
'use strict';
const $=s=>document.querySelector(s);
const SITE='https://trend-insight-site.sungsangkyung77.workers.dev';
const API=(location.hostname.endsWith('workers.dev')?'':SITE);
const PERIODS={d1:{lab:'1일',max:3},w1:{lab:'1주',max:8},m1:{lab:'1개월',max:15},m3:{lab:'3개월',max:30}};
let hotOn=false,HOT=null;
let D=null,SECT=[],period='d1',view='poly',cur=null,selCode=null,TH=null,ALL=new Map(),CUSTOM=null;

/* ───────── 색 ───────── */
function mix(a,b,t){return a.map((v,i)=>Math.round(v+(b[i]-v)*t));}
const C_FLAT=[58,66,88],C_UP=[229,72,77],C_DN=[45,110,235];
function colorOf(v,alpha){
  if(v==null||isNaN(v))return 'rgb(40,45,60)';
  const m=PERIODS[period].max,t=Math.max(-1,Math.min(1,v/m)),e=Math.pow(Math.abs(t),.75);
  const c=mix(C_FLAT,t>=0?C_UP:C_DN,e);
  return alpha!=null?`rgba(${c[0]},${c[1]},${c[2]},${alpha})`:`rgb(${c[0]},${c[1]},${c[2]})`;
}
const pct=v=>v==null||isNaN(v)?'–':(v>0?'+':'')+v.toFixed(2)+'%';
const cls=v=>v>0?'up':v<0?'dn':'';
function capTxt(e){if(e==null)return '–';return e>=10000?(e/10000).toFixed(e>=100000?0:1)+'조':Math.round(e).toLocaleString()+'억';}
function wavg(list,k){let s=0,w=0;for(const x of list){if(x[k]!=null){s+=x[k]*x.cap;w+=x.cap;}}return w?s/w:null;}

/* ───────── 데이터 ───────── */
async function loadData(){
  if(window.__DATA__)return window.__DATA__;
  const r=await fetch('data/market-polyhedron.json?t='+Date.now());
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}
function prep(){
  SECT=D.sectors.map((name,i)=>{
    const st=D.stocks.filter(s=>s.s===name).sort((a,b)=>b.cap-a.cap);
    return {i,name,stocks:st,cap:st.reduce((a,s)=>a+s.cap,0)};
  });
  SECT.forEach(recalc);
  D.stocks.forEach(x=>ALL.set(x.c,x));
}
/* 테마 검색 파일(약 260개 테마 + 유니버스 밖 종목)은 지도가 뜬 뒤 따로 받는다 */
let thPromise=null;
function loadThemes(){
  if(thPromise)return thPromise;
  thPromise=(window.__THEMES__?Promise.resolve(window.__THEMES__):fetch('data/market-polyhedron-themes.json?t='+Date.now()).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}))
    .then(t=>{t.stocks.forEach(x=>{if(!ALL.has(x.c))ALL.set(x.c,x);});TH=t;return t;}).catch(()=>{TH={themes:[],stocks:[],fail:true};return TH;});
  return thPromise;
}
function recalc(s){s.chg=wavg(s.stocks,period);s.up=s.stocks.filter(x=>x[period]>0).length;s.dn=s.stocks.filter(x=>x[period]<0).length;}

/* ───────── 다면체: 면 수 N에 맞춰 자동 생성 ─────────
   구 위에 N개 방향을 고르게 놓고(피보나치 격자), 각 방향에 접하는 평면으로 구를 깎아
   N개의 면을 가진 볼록 다면체를 만든다. N이 바뀌면 면 모양도 따라 바뀐다. */
const V={add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,k)=>[a[0]*k,a[1]*k,a[2]*k],dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  norm:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];}};
function buildPoly(n,wt){
  /* 면 크기 가변: wt[i](합 1)에 비례하도록 평면 거리 d[i]를 조절한다. 가까운 평면일수록 구를 깊게 깎아 면이 커진다. */
  var N=[],i,j,it,L=function(a){return Math.hypot(a[0],a[1],a[2]);};
  if(!wt||wt.length!==n){wt=[];for(i=0;i<n;i++)wt.push(1/n);}
  var g=Math.PI*(3-Math.sqrt(5)),ord=wt.map(function(w,k){return k;}).sort(function(a,b){return wt[b]-wt[a];});
  for(i=0;i<n;i++){var y=1-2*(i+.5)/n,r=Math.sqrt(1-y*y),t=g*i;N.push([Math.cos(t)*r,y,Math.sin(t)*r]);}
  // 큰 면끼리 한쪽에 몰리지 않게 격자 자리를 띄엄띄엄 배정
  var P=new Array(n);ord.forEach(function(face,k){P[face]=N[(k*7)%n];});
  var used={},ok=true;for(i=0;i<n;i++){var key=P[i].join(',');if(used[key])ok=false;used[key]=1;}
  N=ok?P:N;
  var q=wt.map(function(w){return Math.sqrt(Math.max(w,1e-6)*n);});
  for(it=0;it<90;it++){var f=N.map(function(){return[0,0,0];});
    for(i=0;i<n;i++)for(j=i+1;j<n;j++){var dv=V.sub(N[i],N[j]),l=Math.max(.05,L(dv)),k=.02*q[i]*q[j]/(l*l*l);f[i]=V.add(f[i],V.mul(dv,k));f[j]=V.sub(f[j],V.mul(dv,k));}
    N=N.map(function(p,x){return V.norm(V.add(p,f[x]));});}
  var d=[];for(i=0;i<n;i++)d.push(1);
  function cut(){return N.map(function(nrm,fi){
    var ref=Math.abs(nrm[1])<.9?[0,1,0]:[1,0,0],u=V.norm(V.cross(ref,nrm)),v=V.cross(nrm,u),B=8,o=V.mul(nrm,d[fi]);
    var poly=[[-B,-B],[B,-B],[B,B],[-B,B]].map(function(c){return V.add(o,V.add(V.mul(u,c[0]),V.mul(v,c[1])));});
    N.forEach(function(m,mj){if(mj===fi||!poly.length)return;var out=[];
      for(var k=0;k<poly.length;k++){var A=poly[k],Bp=poly[(k+1)%poly.length],da=V.dot(m,A)-d[mj],db=V.dot(m,Bp)-d[mj];
        if(da<=0)out.push(A);if((da<0&&db>0)||(da>0&&db<0))out.push(V.add(A,V.mul(V.sub(Bp,A),da/(da-db))));}
      poly=out;});
    return poly;});}
  function area(p){if(p.length<3)return 0;var s=[0,0,0];for(var k=1;k<p.length-1;k++)s=V.add(s,V.cross(V.sub(p[k],p[0]),V.sub(p[k+1],p[0])));return L(s)/2;}

function peerSet(s){
  let name,list;
  if(view==='map'&&cur===-2&&CUSTOM.stocks.includes(s)){name=CUSTOM.kind+' '+CUSTOM.name;list=CUSTOM.stocks;}
  else if(!s.x){const t=SECT.find(x=>x.name===s.s);name=t.name;list=t.stocks;}
  else{name=s.g;list=[...ALL.values()].filter(x=>x.g===s.g);}
  list=list.slice().sort((a,b)=>b.cap-a.cap);
  return {name,stocks:list,cap:list.reduce((a,x)=>a+x.cap,0)};
}

  const st=[...ALL.values()].filter(x=>has(x.n)||x.c===q).sort((a,b)=>(a.n.toLowerCase().indexOf(q)-b.n.toLowerCase().indexOf(q))||b.cap-a.cap).slice(0,8);

async function fetchBars(code){
  let why='';
  for(let k=0;k<2;k++){
    try{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),25000);
      const r=await fetch(`${API}/api/cockpit/ohlcv/${code}?days=260`,{signal:ac.signal,credentials:'same-origin'});clearTimeout(tm);
      if(!r.ok){why='HTTP '+r.status;continue;}
      const j=await r.json();if(j.ok&&j.data&&j.data.close&&j.data.close.length>30)return {b:j.data};
      why=j.error||'자료 부족';
    }catch(e){why=e.name==='AbortError'?'응답 지연(25초 초과)':'연결 실패';}
  }
  return {b:null,why};
}
async function loadBars(s,sec){
  const {b,why}=await fetchBars(s.c);
  if(selCode!==s.c)return;
  flags(s,sec,b);
  if(b)drawChart(b);
  else{$('#cmeta').innerHTML=`가격 자료를 받지 못했습니다 (${why}) · <a href="#" id="rebars" style="color:#8fb4ff">다시 받기</a>`;
    $('#rebars').onclick=e=>{e.preventDefault();$('#cmeta').textContent='다시 받는 중…';loadBars(s,sec);};}
}

    const v=b.volume,v5=sma(v,5,i),v20=sma(v,20,i);vr=v20?v5/v20:null;

    if(m20<m60&&m60<m120)R.push('이동평균이 역배열(20<60<120일선) — 위에 쌓인 매물을 뚫어야 합니다.');

    if(vr!=null&&vr<.6&&s.m1>10)R.push('최근 5일 거래량이 20일 평균의 60% 미만 — 오르는데 거래가 줄고 있습니다.');
    if(last>m20&&m20>m60&&m60>m120)G.push('이동평균 정배열(20>60>120일선) — 추세가 살아 있습니다.');
    if(rs<32)G.push(`RSI ${rs.toFixed(0)} — 과매도권. 다만 하락 추세 안의 과매도는 더 내려갈 수 있어 반등 확인이 먼저입니다.`);

  }else if(b===null)R.push('가격 자료를 받지 못해 추세·과열 점검을 건너뛰었습니다. 아래 항목은 스냅샷 기준입니다.');
  if(s.pos52!=null&&s.pos52>=92&&s.m1>20)R.push(`52주 고점권(${s.pos52})에서 1개월 ${pct(s.m1)} — 급등 직후 고점 추격 구간입니다.`);
  if(s.m3!=null&&s.m3<-20)R.push(`3개월 ${pct(s.m3)} — 하락 추세. 싸 보여도 바닥 확인 전입니다.`);

  else if(s.per>40&&!(s.fper&&s.fper<25))R.push(`PER ${s.per.toFixed(0)}배${s.fper?` (추정 ${s.fper.toFixed(0)}배)`:''} — 높은 기대가 이미 가격에 들어 있습니다.`);
  if(s.fper&&s.per&&s.fper>s.per*1.15)R.push(`추정PER(${s.fper.toFixed(1)})이 현재 PER(${s.per.toFixed(1)})보다 높음 — 시장은 이익 감소를 예상합니다.`);
  if(s.pbr!=null&&s.pbr>6)R.push(`PBR ${s.pbr.toFixed(1)}배 — 자산 대비 프리미엄이 큽니다.`);

  if(s.val!=null&&s.val<30)R.push(`거래대금 ${capTxt(s.val)} — 유동성이 얕아 사고팔 때 가격이 밀릴 수 있습니다.`);
  if(Math.abs(s.d1||0)>=10)R.push(`당일 ${pct(s.d1)} — 변동성이 매우 큰 날입니다. 원인(공시·뉴스) 확인이 먼저입니다.`);
  if(sm3!=null&&s.m3!=null&&s.m3>sm3+10&&s.m1>0)G.push(`3개월 수익률이 비교군 평균보다 ${(s.m3-sm3).toFixed(0)}%p 높음 — 비교군 내 주도주 쪽입니다.`);
  if(s.fper&&s.per&&s.fper<s.per*.8)G.push(`추정PER(${s.fper.toFixed(1)})이 현재 PER(${s.per.toFixed(1)})보다 낮음 — 이익 증가가 예상됩니다(컨센서스 기준, 빗나갈 수 있음).`);
  if(s.pbr!=null&&s.pbr<1&&s.per!=null&&s.per<12)G.push(`PBR ${s.pbr.toFixed(2)} · PER ${s.per.toFixed(1)} — 자산·이익 대비 낮은 가격대입니다(싼 데는 이유가 있을 수 있음).`);
  if(s.div!=null&&s.div>=3.5)G.push(`배당수익률 ${s.div.toFixed(1)}% — 하방을 받치는 요인입니다.`);
  if(s.pos52!=null&&s.pos52>=85&&!(s.m1>20))G.push(`52주 고점 근처(${s.pos52}) — 위쪽 매물이 적습니다.`);
  if(selCode!==s.c)return;
  $('#risk').innerHTML=R.length?R.map(t=>`<div class="flag">${t}</div>`).join(''):'<div class="flag n">기계적 점검에서 걸린 항목이 없습니다. 실적·공시·수급 위험은 따로 확인해야 합니다.</div>';
  $('#good').innerHTML=G.length?G.map(t=>`<div class="flag g">${t}</div>`).join(''):'<div class="flag n">기계적 점검에서 뚜렷한 강점이 잡히지 않았습니다.</div>';
}
function drawChart(b){
  const el=$('#chart');if(!el)return;const w=el.clientWidth,h=el.clientHeight,d=Math.min(2,devicePixelRatio||1);el.width=w*d;el.height=h*d;
  const c=el.getContext('2d');c.setTransform(d,0,0,d,0,0);const cl=b.close,n=cl.length,lo=Math.min(...b.low.slice(-n)),hi=Math.max(...b.high.slice(-n));
  const X=i=>6+i*(w-12)/(n-1),Y=v=>10+(hi-v)*(h-34)/(hi-lo||1);
  const vmax=Math.max(...b.volume);c.fillStyle='rgba(120,140,190,.28)';
  for(let i=0;i<n;i++){const vh=b.volume[i]/vmax*22;c.fillRect(X(i)-.6,h-2-vh,1.4,vh);}
  const line=(f,col,lw)=>{c.beginPath();let st=false;for(let i=0;i<n;i++){const v=f(i);if(v==null)continue;st?c.lineTo(X(i),Y(v)):(c.moveTo(X(i),Y(v)),st=true);}c.strokeStyle=col;c.lineWidth=lw;c.stroke();};
  line(i=>sma(cl,120,i),'#8b5cf6',1);line(i=>sma(cl,60,i),'#f5a524',1);line(i=>sma(cl,20,i),'#12b886',1);
  line(i=>cl[i],cl[n-1]>=cl[0]?'#ff6b6f':'#6ea4ff',1.8);
  c.fillStyle='#93a0bb';c.font="600 11px Pretendard,'Malgun Gothic',sans-serif";c.textAlign='left';c.fillText(Math.round(hi).toLocaleString(),6,10);c.fillText(Math.round(lo).toLocaleString(),6,h-28);
  $('#cmeta').innerHTML=`${b.date[0]} ~ ${b.date[n-1]} · <span style="color:#12b886">20</span>·<span style="color:#f5a524">60</span>·<span style="color:#8b5cf6">120</span>일선`;
}

/* ───────── 공통 조작 ───────── */
$('#period').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  period=b.dataset.p;$('#period').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  SECT.forEach(recalc);buildChips();crumb();legend();if(view==='map')renderMap();});
/* ───────── 특징주 패널 ───────── */
function setHot(on){hotOn=on;$('#hot').classList.toggle('show',on&&view==='poly');$('#hotbtn').style.borderColor=on?'#ff7a45':'';try{localStorage.setItem('mp-hot',on?'1':'0');}catch(e){}}
function hotRow(x,i,sub){return `<div class="hr" data-c="${x.c}"><i>${i+1}</i><span class="n">${x.n}</span><span class="p ${cls(x.d1)}">${pct(x.d1)}</span><span class="d">${sub}</span></div>`;}
function renderHot(){
  if(!HOT)return;
  const up=HOT.up||[],tk=HOT.talk||[];
  $('#hot-up').innerHTML=up.length?up.map((x,i)=>hotRow(x,i,`${x.s} · 거래량 ${x.vr}배 · 대금 ${capTxt(x.val)}`)).join(''):'<div class="he">조건에 맞는 종목이 없습니다.</div>';
  $('#hot-tk').innerHTML=tk.length?tk.map((x,i)=>hotRow(x,i,`검색 ${x.rank}위 · 글 ${x.pph}건/시간${x.neg!=null?' · 비공감 '+x.neg+'%':''}`)).join(''):'<div class="he">자료가 없습니다.</div>';
  $('#hot-up-m').textContent=`${HOT.asof} 종가 · 상승률 상위 중 거래량이 20일 평균의 1.5배 이상 · 대금 30억 이상`;
  $('#hot-tk-m').textContent=`${HOT.generated} 수집 · 인기검색 50종목 중 토론방 글이 가장 빠른 순`;
  $('#hot').querySelectorAll('.hr').forEach(e=>e.onclick=()=>{
    const hx=[...up,...tk].find(y=>y.c===e.dataset.c),u=D.stocks.find(y=>y.c===e.dataset.c);
    if(u){goStock(u);return;}
    loadThemes().then(()=>{if(!ALL.has(hx.c))ALL.set(hx.c,hx);goStock(ALL.get(hx.c));});});
}
function loadHot(){
  (window.__HOT__?Promise.resolve(window.__HOT__):fetch('data/market-polyhedron-hot.json?t='+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json();}))
    .then(h=>{HOT=h;renderHot();}).catch(()=>{$('#hot-up').innerHTML=$('#hot-tk').innerHTML='<div class="he">특징주 자료를 불러오지 못했습니다.</div>';});
}
$('#hotbtn').onclick=()=>{if(view!=='poly'){backToPoly();setHot(true);}else setHot(!hotOn);};
$('#memobtn').onclick=()=>$('#memo').classList.toggle('show');
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#memo')&&!e.target.closest('#memobtn'))$('#memo').classList.remove('show');});
$('#allbtn').onclick=()=>{if(view==='map'&&cur===-1)backToPoly();else openMap(-1);};
addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(panel.classList.contains('show'))closePanel();else if(view==='map')backToPoly();}
  if(view==='map'&&cur>=0&&!panel.classList.contains('show')){if(e.key==='ArrowRight')openMap((cur+1)%SECT.length);if(e.key==='ArrowLeft')openMap((cur-1+SECT.length)%SECT.length);}
  if(view==='poly'){const s=.18;if(e.key==='ArrowLeft')rotBy(-s,0);if(e.key==='ArrowRight')rotBy(s,0);if(e.key==='ArrowUp')rotBy(0,-s);if(e.key==='ArrowDown')rotBy(0,s);idle=0;}
});
addEventListener('resize',resize);

loadData().then(d=>{
  D=d;prep();FACES=buildPoly(SECT.length,faceWeights(SECT.map(x=>({cap:x.cap,cnt:x.stocks.length}))));
  $('#asof').textContent=D.asof+' 종가 기준';$('#load').style.display='none';
  resize();buildChips();crumb();legend();requestAnimationFrame(frame);
  setTimeout(loadThemes,600);loadHot();
  {let pref=null;try{pref=localStorage.getItem('mp-hot');}catch(e){}setHot(pref?pref==='1':W>900);}
  const h=decodeURIComponent(location.hash.slice(1));
  if(h.startsWith('q=')){const key=h.slice(2);loadThemes().then(t=>{const th=t.themes.find(x=>x.n===key);
      if(th)openCustom('테마',th.n,th.c.map(c=>ALL.get(c)).filter(Boolean));
      else{const l=[...ALL.values()].filter(x=>x.g===key);if(l.length)openCustom('업종',key,l);}});}
  else if(h==='all')openMap(-1);else{const i=SECT.findIndex(s=>s.name===h);if(i>=0)openMap(i);}
  const code=new URLSearchParams(location.search).get('code');
  if(code){const s=D.stocks.find(x=>x.c===code);if(s){openMap(SECT.findIndex(x=>x.name===s.s));openStock(s);}else loadThemes().then(()=>{const x=ALL.get(code);if(x)goStock(x);});}
}).catch(e=>{$('#load').innerHTML='지도 데이터를 불러오지 못했습니다.<br><small>'+e.message+' — 「산업 다면체 지도 갱신」을 요청해 데이터를 먼저 게시하세요.</small>';});
})();
