<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 격언</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#111; --sub:#888; --accent:#0b5cd6; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:#fff;
    height:100dvh;display:flex;flex-direction:column;
  }

  /* ── 오늘의 격언 (위쪽, 남는 공간 전부) ── */
  .today{
    flex:1 1 auto;min-height:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:16px 20px 12px;
  }
  .today .meta{
    font-size:clamp(11px,2.8vw,13px);letter-spacing:.15em;color:var(--sub);
    margin-bottom:4px;
    opacity:0;animation:fadeUp .9s ease .1s forwards;
  }
  .today .tag{
    display:inline-block;font-size:clamp(10px,2.5vw,12px);letter-spacing:.12em;
    color:var(--accent);border:1px solid currentColor;border-radius:999px;
    padding:2px 10px;margin-bottom:clamp(14px,3.5vh,32px);
    opacity:0;animation:fadeUp .9s ease .25s forwards;
  }
  .today .quote{
    font-family:'Noto Serif KR',serif;font-weight:700;
    font-size:clamp(19px,5vw,38px);line-height:1.5;
    max-width:19em;word-break:keep-all;
    opacity:0;animation:fadeUp 1.3s ease .45s forwards;
  }
  .today .quote-en{
    font-family:Georgia,'Times New Roman',serif;font-style:italic;
    font-size:clamp(12.5px,3.3vw,18px);line-height:1.5;color:#9a9aa0;
    max-width:32em;word-break:normal;margin-top:clamp(10px,2.2vh,20px);
    opacity:0;animation:fadeUp 1.2s ease .85s forwards;
  }
  .today .author{
    margin-top:clamp(12px,3vh,26px);font-size:clamp(12px,3.2vw,15px);
    color:var(--sub);letter-spacing:.06em;
    opacity:0;animation:fadeUp 1.1s ease 1.25s forwards;
  }
  .today .author::before,.today .author::after{content:"—";margin:0 .55em;color:#ccc}
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(16px)}
    to{opacity:1;transform:translateY(0)}
  }

  /* ── 지난 격언 (아래쪽, 컴팩트) ── */
  .past{
    flex:0 0 auto;background:#0d0d0f;color:#f2f2f2;
    padding:clamp(12px,2.4vh,22px) 20px clamp(12px,2.6vh,24px);
  }
  .past .inner{max-width:720px;margin:0 auto}
  .past h2{
    font-size:clamp(9.5px,2.3vw,11px);font-weight:500;letter-spacing:.32em;
    color:#6c6c74;text-align:center;margin-bottom:clamp(8px,1.6vh,14px);
  }
  .past .item{
    padding:clamp(7px,1.4vh,12px) 2px;border-bottom:1px solid #232327;
    opacity:0;animation:fadeUp .8s ease forwards;
  }
  .past .item:nth-child(1){animation-delay:1.2s}
  .past .item:nth-child(2){animation-delay:1.35s}
  .past .item:nth-child(3){animation-delay:1.5s}
  .past .item:last-child{border-bottom:none;padding-bottom:2px}
  .past .pdate{
    font-size:clamp(10px,2.5vw,11.5px);color:#75757d;letter-spacing:.1em;
    margin-bottom:3px;
  }
  .past .ptext{
    font-family:'Noto Serif KR',serif;
    font-size:clamp(12.5px,3.4vw,16px);line-height:1.55;
    word-break:keep-all;color:#e6e6e9;
  }
  .past .pauthor{display:inline;color:#84848c;font-family:'Noto Sans KR',sans-serif;
    font-size:clamp(10.5px,2.7vw,12.5px);margin-left:.6em;white-space:nowrap}
  .past .pauthor::before{content:"—";margin-right:.4em;color:#44444a}

  /* 낮은 화면(가로 모드 등)에서는 여백 최소화 */
  @media (max-height:600px){
    .today .tag{margin-bottom:10px}
    .today .quote{font-size:clamp(16px,4vw,26px)}
    .past .h2{margin-bottom:6px}
  }
</style>
</head>
<body>

<section class="today">
  <div class="meta" id="today-date"></div>
  <div class="tag" id="today-tag"></div>
  <div class="quote" id="today-quote"></div>
  <div class="quote-en" id="today-en"></div>
  <div class="author" id="today-author"></div>
</section>

<section class="past">
  <div class="inner">
    <h2>지 난 격 언</h2>
    <div id="past-list"></div>
  </div>
</section>

const CAT_LABEL = {exam:"수험 실전", sci:"과학자의 말", classic:"고전 · 사자성어", grit:"끈기 · 노력"};
const N = QUOTES.length;
/* N과 서로소인 보폭 → 매일 다른 격언, 카테고리가 자연스럽게 섞여 N일 주기로 전체 순환 */
function stride(){ const cands=[37,41,43,47,53]; for(const s of cands){ if(N % s !== 0) return s; } return 1; }
const S = stride();

/* KST(UTC+9) 기준 날짜 계산 — 어디서 접속해도 한국 날짜 기준 */
function kstDayIndex(offsetDays){ offsetDays = offsetDays||0;
  return Math.floor((Date.now() + 9*3600*1000) / 86400000) - offsetDays;
}
function quoteFor(dayIdx){ return QUOTES[((dayIdx * S) % N + N) % N]; }
function kstDateStr(offsetDays){ offsetDays = offsetDays||0;
  const d = new Date(Date.now() + 9*3600*1000 - offsetDays*86400000);
  const days = ["일","월","화","수","목","금","토"];
  return d.getUTCFullYear()+"년 "+(d.getUTCMonth()+1)+"월 "+d.getUTCDate()+"일 ("+days[d.getUTCDay()]+")";
}

const today = quoteFor(kstDayIndex());
document.getElementById("today-date").textContent = kstDateStr();
document.getElementById("today-tag").textContent = CAT_LABEL[today.c];
document.getElementById("today-quote").textContent = today.t;
document.getElementById("today-en").textContent = today.e;
document.getElementById("today-author").textContent = today.a;

const list = document.getElementById("past-list");
[1,2,3].forEach(function(off){
  const q = quoteFor(kstDayIndex(off));
  const div = document.createElement("div");
  div.className = "item";
  div.innerHTML = '<div class="pdate">'+kstDateStr(off)+' · '+CAT_LABEL[q.c]+'</div>'+
    '<div class="ptext">'+q.t+'<span class="pauthor">'+q.a+'</span></div>';
  list.appendChild(div);
});
</script>
